name: Bump Download

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bump-download-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'HLND2T/CS2_VibeSignatures'
    environment: win64
    runs-on: [self-hosted, windows, x64]
    outputs:
      updated: ${{ steps.bump.outputs.updated }}
      skip_pr: ${{ steps.duplicate.outputs.skip_pr }}
      gamever: ${{ steps.bump.outputs.tag }}
      source_gamever: ${{ steps.bump.outputs.analysis_config_source_gamever }}
      config_path: ${{ steps.bump.outputs.analysis_config_path }}
      candidate_artifact_name: ${{ steps.package.outputs.artifact_name }}
      candidate_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      DEPOTDOWNLOADER_STEAM_USERNAME: ${{ secrets.DEPOTDOWNLOADER_STEAM_USERNAME }}
      DEPOTDOWNLOADER_STEAM_PASSWORD: ${{ secrets.DEPOTDOWNLOADER_STEAM_PASSWORD }}
    steps:
      - name: Checkout main
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Synchronize git refs
        id: sync-refs
        shell: pwsh
        run: |
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path -replace '\\', '/'
          git config --global --add safe.directory "$workspace"
          git fetch origin --prune --prune-tags --tags "+refs/heads/*:refs/remotes/origin/*"
          $baseSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $baseSha -ne $env:GITHUB_SHA.ToLowerInvariant()) {
            throw "Bump checkout drifted from the immutable workflow SHA."
          }

      - name: Configure git
        id: configure-git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Preview download bump
        id: preview
        shell: pwsh
        run: uv run bump_download.py -config download.yaml -configs-dir configs -depotdir cs2_depot -username "$env:DEPOTDOWNLOADER_STEAM_USERNAME" -password "$env:DEPOTDOWNLOADER_STEAM_PASSWORD" -remember-password -dry-run -github-output "$env:GITHUB_OUTPUT"

      - name: Check duplicate bump target
        id: duplicate
        if: steps.preview.outputs.updated == 'true'
        uses: actions/github-script@v7
        env:
          BUMP_TAG: ${{ steps.preview.outputs.tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = process.env.BUMP_TAG;
            if (!tag || !tag.trim()) {
              throw new Error('steps.preview.outputs.tag is empty.');
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `chore(download): Update manifest for ${tag}`;

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
              core.notice(`Tag ${tag} already exists. Skipping bump pull request.`);
              core.setOutput('skip_pr', 'true');
              core.setOutput('reason', 'tag_exists');
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existingPull = pulls.find((pull) => pull.title === title);

            if (existingPull) {
              core.notice(`Bump pull request already exists: ${existingPull.html_url}`);
              core.setOutput('skip_pr', 'true');
              core.setOutput('reason', 'pull_request_exists');
              return;
            }

            core.setOutput('skip_pr', 'false');

      - name: Bump download config
        id: bump
        if: steps.preview.outputs.updated != 'true' || steps.duplicate.outputs.skip_pr != 'true'
        shell: pwsh
        run: uv run bump_download.py -config download.yaml -configs-dir configs -depotdir cs2_depot -username "$env:DEPOTDOWNLOADER_STEAM_USERNAME" -password "$env:DEPOTDOWNLOADER_STEAM_PASSWORD" -remember-password -github-output "$env:GITHUB_OUTPUT"

      - name: Enroll source lock from a fresh checkout-external depot
        id: enroll-lock
        if: steps.bump.outputs.updated == 'true' && steps.duplicate.outputs.skip_pr != 'true'
        shell: pwsh
        env:
          CANDIDATE_GAMEVER: ${{ steps.bump.outputs.tag }}
          CANDIDATE_SOURCE_GAMEVER: ${{ steps.bump.outputs.analysis_config_source_gamever }}
        run: |
          $tag = $env:CANDIDATE_GAMEVER
          $freshRoot = Join-Path $env:RUNNER_TEMP "bump-binary-enrollment\$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$tag"
          if (Test-Path -LiteralPath $freshRoot) {
            throw "Fresh binary enrollment root already exists: $freshRoot"
          }
          $depotRoot = Join-Path $freshRoot "depot"
          $binRoot = Join-Path $freshRoot "bin"
          New-Item -ItemType Directory -Path $depotRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $binRoot -Force | Out-Null
          uv run python download_depot.py -tag "$tag" -config download.yaml `
            -configyaml "configs/$tag.yaml" -depotdir "$depotRoot" `
            -username "$env:DEPOTDOWNLOADER_STEAM_USERNAME" `
            -password "$env:DEPOTDOWNLOADER_STEAM_PASSWORD" -remember-password
          if ($LASTEXITCODE -ne 0) { throw "Fresh depot download failed for $tag." }
          uv run python copy_depot_bin.py -gamever "$tag" -platform all-platform `
            -config "configs/$tag.yaml" -depotdir "$depotRoot" -bindir "$binRoot"
          if ($LASTEXITCODE -ne 0) { throw "Fresh configured binary copy failed for $tag." }
          $enrollmentJson = uv run python bump_download_candidate.py enroll-lock `
            --repo-root "$env:GITHUB_WORKSPACE" --base-sha "$env:GITHUB_SHA" `
            --gamever "$tag" --source-gamever "$env:CANDIDATE_SOURCE_GAMEVER" `
            --repository "$env:GITHUB_REPOSITORY" --binary-root (Join-Path $binRoot $tag)
          if ($LASTEXITCODE -ne 0) { throw "Source-owned binary lock enrollment failed for $tag." }
          $enrollment = $enrollmentJson | ConvertFrom-Json
          if ($enrollment.binary_lock_sha256 -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Binary lock enrollment omitted its canonical digest."
          }
          "binary_lock_sha256=$($enrollment.binary_lock_sha256)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package credential-free download bump candidate
        if: steps.bump.outputs.updated == 'true' && steps.duplicate.outputs.skip_pr != 'true'
        id: package
        shell: pwsh
        env:
          CANDIDATE_GAMEVER: ${{ steps.bump.outputs.tag }}
          CANDIDATE_SOURCE_GAMEVER: ${{ steps.bump.outputs.analysis_config_source_gamever }}
        run: |
          $tag = $env:CANDIDATE_GAMEVER
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "steps.bump.outputs.tag is empty."
          }
          $candidate = Join-Path $env:RUNNER_TEMP "bump-download-candidate\$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          uv run python bump_download_candidate.py build `
            --repo-root "$env:GITHUB_WORKSPACE" `
            --base-sha "$env:GITHUB_SHA" `
            --gamever "$tag" `
            --source-gamever "$env:CANDIDATE_SOURCE_GAMEVER" `
            --repository "$env:GITHUB_REPOSITORY" `
            --workflow-run-id "$env:GITHUB_RUN_ID" `
            --workflow-run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --output-root "$candidate"
          if ($LASTEXITCODE -ne 0) { throw "Download bump candidate validation failed." }
          $artifactName = "bump-download-candidate-$tag-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "artifact_name=$artifactName" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "CANDIDATE_ROOT=$candidate" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upload exact download bump candidate
        id: upload
        if: steps.bump.outputs.updated == 'true' && steps.duplicate.outputs.skip_pr != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ env.CANDIDATE_ROOT }}
          if-no-files-found: error
          retention-days: 7
  publish-bump-branch:
    needs: bump
    if: needs.bump.outputs.updated == 'true' && needs.bump.outputs.skip_pr != 'true'
    environment: artifact-bootstrap
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Validate untrusted bump job outputs
        id: validate-inputs
        shell: pwsh
        env:
          UNTRUSTED_GAMEVER: ${{ needs.bump.outputs.gamever }}
          UNTRUSTED_SOURCE_GAMEVER: ${{ needs.bump.outputs.source_gamever }}
          UNTRUSTED_CONFIG_PATH: ${{ needs.bump.outputs.config_path }}
          UNTRUSTED_ARTIFACT_NAME: ${{ needs.bump.outputs.candidate_artifact_name }}
          UNTRUSTED_ARTIFACT_DIGEST: ${{ needs.bump.outputs.candidate_artifact_digest }}
        run: |
          $gameverPattern = '\A(?:[0-9]{4,10}[a-z]?|[1-9][0-9]*)\z'
          $gamever = $env:UNTRUSTED_GAMEVER
          $sourceGamever = $env:UNTRUSTED_SOURCE_GAMEVER
          if (-not [regex]::IsMatch($gamever, $gameverPattern) -or
              -not [regex]::IsMatch($sourceGamever, $gameverPattern) -or
              $gamever -eq $sourceGamever) {
            throw "Self-hosted bump job returned an invalid GAMEVER identity."
          }
          $expectedConfigPath = "configs/$gamever.yaml"
          if ($env:UNTRUSTED_CONFIG_PATH -cne $expectedConfigPath) {
            throw "Self-hosted bump job returned an invalid config path."
          }
          $expectedArtifactName = "bump-download-candidate-$gamever-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($env:UNTRUSTED_ARTIFACT_NAME -cne $expectedArtifactName) {
            throw "Self-hosted bump job returned an invalid artifact name."
          }
          $artifactDigest = $env:UNTRUSTED_ARTIFACT_DIGEST.ToLowerInvariant()
          if ([regex]::IsMatch($artifactDigest, '\A[0-9a-f]{64}\z')) {
            $artifactDigest = "sha256:$artifactDigest"
          }
          if (-not [regex]::IsMatch($artifactDigest, '\Asha256:[0-9a-f]{64}\z')) {
            throw "Self-hosted bump job returned an invalid artifact digest."
          }
          "gamever=$gamever" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_gamever=$sourceGamever" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "config_path=$expectedConfigPath" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=$expectedArtifactName" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_digest=$artifactDigest" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Checkout exact bound default-branch base without credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: publication
      - name: Set up trusted publisher environment
        uses: astral-sh/setup-uv@v9.0.0
      - name: Sync trusted publisher dependencies
        run: uv sync --project publication --locked
      - name: Download exact credential-free bump candidate
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.validate-inputs.outputs.artifact_name }}
          path: candidate
      - name: Revalidate candidate and create direct-child bump commit
        id: prepare
        shell: pwsh
        env:
          CANDIDATE_GAMEVER: ${{ steps.validate-inputs.outputs.gamever }}
          CANDIDATE_SOURCE_GAMEVER: ${{ steps.validate-inputs.outputs.source_gamever }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.validate-inputs.outputs.artifact_name }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.validate-inputs.outputs.artifact_digest }}
        run: |
          git -C publication config user.name "source-artifact-automation"
          git -C publication config user.email "source-artifact-automation@users.noreply.github.com"
          $receipt = Join-Path $env:GITHUB_WORKSPACE "bump-publication-receipt.json"
          Set-Location -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "publication")
          uv run python bump_download_candidate.py prepare `
            --repo-root . `
            --candidate-root (Join-Path $env:GITHUB_WORKSPACE "candidate") `
            --manifest (Join-Path $env:GITHUB_WORKSPACE "candidate/candidate-manifest.json") `
            --repository "$env:GITHUB_REPOSITORY" `
            --base-sha "$env:GITHUB_SHA" `
            --gamever "$env:CANDIDATE_GAMEVER" `
            --source-gamever "$env:CANDIDATE_SOURCE_GAMEVER" `
            --actions-artifact-name "$env:CANDIDATE_ARTIFACT_NAME" `
            --actions-artifact-digest "$env:CANDIDATE_ARTIFACT_DIGEST" `
            --workflow-run-id "$env:GITHUB_RUN_ID" `
            --workflow-run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --workflow-run-url "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
            --output "$receipt"
          if ($LASTEXITCODE -ne 0) { throw "Hosted download bump candidate verification failed." }
          $document = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          "commit_sha=$($document.commit_sha)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Confirm target branch, tag, and pull request are still absent
        shell: pwsh
        env:
          BUMP_GAMEVER: ${{ steps.validate-inputs.outputs.gamever }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:BUMP_GAMEVER
          $branch = "bump-download/$tag"
          git -C publication ls-remote --exit-code --heads origin "refs/heads/$branch" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Target bump branch already exists: $branch" }
          if ($LASTEXITCODE -ne 2) { throw "Unable to prove the target bump branch is absent." }
          git -C publication ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Target release tag already exists: $tag" }
          if ($LASTEXITCODE -ne 2) { throw "Unable to prove the target release tag is absent." }
          $pulls = gh api --method GET "repos/$env:GITHUB_REPOSITORY/pulls" `
            -f state=open -f "head=$env:GITHUB_REPOSITORY_OWNER`:$branch" -f per_page=100 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to query existing bump pull requests." }
          if (@($pulls).Count -ne 0) { throw "Target bump pull request already exists: $branch" }
      - name: Fast-forward create the bound bump branch with protected PAT
        shell: pwsh
        env:
          BUMP_BRANCH: bump-download/${{ steps.validate-inputs.outputs.gamever }}
          GIT_USERNAME: source-artifact-automation
          GIT_PASSWORD: ${{ secrets.SOURCE_ARTIFACT_BOOTSTRAP_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GIT_PASSWORD)) { throw "SOURCE_ARTIFACT_BOOTSTRAP_PAT is unavailable." }
          $askpass = Join-Path $env:RUNNER_TEMP "source-artifact-bump-askpass.sh"
          @'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$GIT_USERNAME" ;;
            *Password*) printf '%s\n' "$GIT_PASSWORD" ;;
            *) exit 1 ;;
          esac
          '@ | Set-Content -LiteralPath $askpass -Encoding utf8NoBOM
          chmod 700 $askpass
          try {
            $env:GIT_ASKPASS = $askpass
            $env:GIT_TERMINAL_PROMPT = "0"
            git -C publication -c credential.helper= -c core.hooksPath=/dev/null push origin `
              "HEAD:refs/heads/$env:BUMP_BRANCH"
            if ($LASTEXITCODE -ne 0) { throw "Protected bump branch creation failed." }
          } finally {
            Remove-Item -LiteralPath $askpass -Force -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_ASKPASS -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_PASSWORD -ErrorAction SilentlyContinue
          }
      - name: Create bump pull request with read/write PR token
        uses: actions/github-script@v7
        env:
          BUMP_TAG: ${{ steps.validate-inputs.outputs.gamever }}
          BUMP_BRANCH: bump-download/${{ steps.validate-inputs.outputs.gamever }}
          COMMIT_SHA: ${{ steps.prepare.outputs.commit_sha }}
          CONFIG_SOURCE_GAMEVER: ${{ steps.validate-inputs.outputs.source_gamever }}
          CONFIG_PATH: ${{ steps.validate-inputs.outputs.config_path }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = process.env.BUMP_TAG;
            const branch = process.env.BUMP_BRANCH;
            if (!tag || !tag.trim()) {
              throw new Error('steps.bump.outputs.tag is empty.');
            }
            if (!branch || !branch.trim()) {
              throw new Error('steps.branch.outputs.branch is empty.');
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `chore(download): Update manifest for ${tag}`;

            const publishedRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`,
            });
            if (publishedRef.data.object.sha !== process.env.COMMIT_SHA) {
              throw new Error('Published bump branch does not point to the verified hosted commit.');
            }
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existingPull = pulls.find((pull) => {
              if (pull.title === title) {
                return true;
              }
              return pull.base.ref === process.env.DEFAULT_BRANCH &&
                pull.head.ref === branch &&
                pull.head.repo?.full_name === `${owner}/${repo}`;
            });

            if (existingPull) {
              throw new Error(`Bump pull request appeared concurrently: ${existingPull.html_url}`);
            }

            const { data: pull } = await github.rest.pulls.create({
              owner,
              repo,
              base: process.env.DEFAULT_BRANCH,
              head: branch,
              title,
              body: [
                `Automated download bump for tag \`${tag}\`.`,
                `Seeded analysis config: \`${process.env.CONFIG_SOURCE_GAMEVER}\` -> \`${process.env.CONFIG_PATH}\` (exact initial copy; review before merge).`,
                '',
                'A protected Contents-only PAT push will synchronize this PR after creation so required validation is triggered.',
                'After this PR is merged, the post-merge workflow will invoke the protected Release workflow from the merge SHA.',
                '',
                `<!-- bump-download-tag: ${tag} -->`,
              ].join('\n'),
            });

            core.notice(`Created bump pull request: ${pull.html_url}`);
      - name: Synchronize the new PR head with a protected PAT validation trigger
        id: synchronize
        shell: pwsh
        env:
          BUMP_GAMEVER: ${{ steps.validate-inputs.outputs.gamever }}
          SOURCE_BUMP_COMMIT: ${{ steps.prepare.outputs.commit_sha }}
          GIT_USERNAME: source-artifact-automation
          GIT_PASSWORD: ${{ secrets.SOURCE_ARTIFACT_BOOTSTRAP_PAT }}
        run: |
          git -C publication -c core.hooksPath=/dev/null commit --allow-empty `
            -m "chore(ci): trigger validation for $env:BUMP_GAMEVER" `
            -m "Source-Bump-Commit: $env:SOURCE_BUMP_COMMIT`nWorkflow-Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`nCo-Authored-By: Codex <codex@openai.com>"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create the PR validation-trigger commit." }
          $triggerSha = (git -C publication rev-parse HEAD).Trim().ToLowerInvariant()
          if ($triggerSha -notmatch '^[0-9a-f]{40}$') { throw "Validation-trigger commit SHA is invalid." }
          if ([string]::IsNullOrWhiteSpace($env:GIT_PASSWORD)) { throw "SOURCE_ARTIFACT_BOOTSTRAP_PAT is unavailable." }
          $askpass = Join-Path $env:RUNNER_TEMP "source-artifact-sync-askpass.sh"
          @'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$GIT_USERNAME" ;;
            *Password*) printf '%s\n' "$GIT_PASSWORD" ;;
            *) exit 1 ;;
          esac
          '@ | Set-Content -LiteralPath $askpass -Encoding utf8NoBOM
          chmod 700 $askpass
          try {
            $env:GIT_ASKPASS = $askpass
            $env:GIT_TERMINAL_PROMPT = "0"
            git -C publication -c credential.helper= -c core.hooksPath=/dev/null push origin `
              "HEAD:refs/heads/bump-download/$env:BUMP_GAMEVER"
            if ($LASTEXITCODE -ne 0) { throw "Protected PR synchronization push failed." }
          } finally {
            Remove-Item -LiteralPath $askpass -Force -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_ASKPASS -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_PASSWORD -ErrorAction SilentlyContinue
          }
          "trigger_sha=$triggerSha" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Verify synchronized PR head
        uses: actions/github-script@v7
        env:
          BUMP_BRANCH: bump-download/${{ steps.validate-inputs.outputs.gamever }}
          TRIGGER_SHA: ${{ steps.synchronize.outputs.trigger_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${process.env.BUMP_BRANCH}`,
              per_page: 100,
            });
            if (pulls.length !== 1 || pulls[0].head.sha !== process.env.TRIGGER_SHA) {
              throw new Error('Synchronized bump pull request head does not match the protected PAT push.');
            }
            core.notice(`Synchronized bump pull request: ${pulls[0].html_url}`);
