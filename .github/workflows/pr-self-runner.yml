name: PR Self Runner Validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
permissions:
  contents: read
concurrency:
  group: pr-self-runner-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-preflight:
    if: >-
      github.event.action != 'closed' &&
      (github.repository == 'HLND2T/CS2_VibeSignatures' ||
       github.repository == 'hzqst/CS2_VibeSignatures') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
         startsWith(github.event.pull_request.head.ref, 'gamesymbols/build/') &&
         startsWith(github.event.pull_request.title, 'chore(gamesymbols): publish '))
    runs-on: ubuntu-latest
    outputs:
      requires_warmup: ${{ steps.identify.outputs.requires-warmup }}
      gamever: ${{ steps.resolve-version.outputs.gamever }}
      pr_gamever: ${{ steps.resolve-version.outputs.pr_gamever }}
      base_snapshot_path: ${{ steps.resolve-version.outputs.base_snapshot_path }}
      base_snapshot_commit: ${{ steps.resolve-version.outputs.base_snapshot_commit }}
      source_sha: ${{ steps.identify.outputs.source-sha }}
      base_sha: ${{ steps.identify.outputs.base-sha }}
    steps:
      - name: Checkout PR merge ref for cache identity
        id: checkout-preflight
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          submodules: false
      - name: Resolve PR cache eligibility and immutable source
        id: identify
        shell: pwsh
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          $isBot = $env:PR_USER_LOGIN -eq "github-actions[bot]"
          $headRef = $env:PR_HEAD_REF
          $title = $env:PR_TITLE
          $isBump = $isBot -and $headRef.StartsWith("bump-download/") -and $title.StartsWith("chore(download): Update manifest for ")
          $requiresWarmup = if ($isBump) { "false" } else { "true" }
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Unable to resolve the PR merge commit SHA."
          }
          $baseSha = (git rev-parse HEAD^1).Trim()
          if ($LASTEXITCODE -ne 0 -or $baseSha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Unable to resolve the PR merge base SHA."
          }
          "requires-warmup=$requiresWarmup" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source-sha=$($sourceSha.ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "base-sha=$($baseSha.ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Set up uv for validation version resolution
        id: setup-preflight-uv
        if: steps.identify.outputs.requires-warmup == 'true'
        uses: astral-sh/setup-uv@v9.0.0
      - name: Resolve exact PR validation GAMEVER
        id: resolve-version
        if: steps.identify.outputs.requires-warmup == 'true'
        shell: pwsh
        run: |
          uv run python pr_validation_version.py `
            --repo-root "${{ github.workspace }}" `
            --base-ref "${{ steps.identify.outputs.base-sha }}" `
            --github-output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw "Failed to resolve PR validation GAMEVER." }
  pr-warmup-idb:
    needs: pr-preflight
    if: needs.pr-preflight.outputs.requires_warmup == 'true'
    uses: ./.github/workflows/warmup-idb.yml
    with:
      gamever: ${{ needs.pr-preflight.outputs.gamever }}
      source_sha: ${{ needs.pr-preflight.outputs.source_sha }}
    secrets: inherit
  pr-validate:
    needs: [pr-preflight, pr-warmup-idb]
    if: >-
      always() &&
      needs.pr-preflight.result == 'success' &&
      (needs.pr-preflight.outputs.requires_warmup != 'true' ||
       needs.pr-warmup-idb.result == 'success')
    environment: win64
    runs-on: [self-hosted, windows, x64]
    env:
      WORKSPACE: ${{ github.workspace }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CS2VIBE_AGENT: ${{ secrets.CS2VIBE_AGENT }}
      CS2VIBE_AGENT_MODEL: ${{ secrets.CS2VIBE_AGENT_MODEL }}
      CS2VIBE_LLM_APIKEY: ${{ secrets.CS2VIBE_LLM_APIKEY }}
      CS2VIBE_LLM_BASEURL: ${{ secrets.CS2VIBE_LLM_BASEURL }}
      CS2VIBE_LLM_EFFORT: ${{ secrets.CS2VIBE_LLM_EFFORT }}
      CS2VIBE_LLM_FAKE_AS: ${{ secrets.CS2VIBE_LLM_FAKE_AS }}
      CS2VIBE_LLM_MODEL: ${{ secrets.CS2VIBE_LLM_MODEL }}
      PERSISTED_WORKSPACE: ${{ secrets.PERSISTED_WORKSPACE }}
      PR_SOURCE_SHA: ${{ needs.pr-preflight.outputs.source_sha }}
      PR_BASE_SHA: ${{ needs.pr-preflight.outputs.base_sha }}
      PREFLIGHT_PR_GAMEVER: ${{ needs.pr-preflight.outputs.pr_gamever }}
      PREFLIGHT_GAMEVER: ${{ needs.pr-preflight.outputs.gamever }}
      PREFLIGHT_BASE_SNAPSHOT_PATH: ${{ needs.pr-preflight.outputs.base_snapshot_path }}
      PREFLIGHT_BASE_SNAPSHOT_COMMIT: ${{ needs.pr-preflight.outputs.base_snapshot_commit }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
      IDB_CACHE_GENERATION: ${{ needs.pr-warmup-idb.outputs.generation }}
      IDB_CACHE_KEY: ${{ needs.pr-warmup-idb.outputs.cache_key }}
      SUBMODULE_CACHE_VERSION: v1
    steps:
      - name: Checkout PR merge ref
        id: checkout-merge
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.pr-preflight.outputs.source_sha }}
          # Full history keeps the pinned merge commit, its pinned base parent,
          # and historical snapshot publication commits available locally.
          fetch-depth: 0
          submodules: false
      - name: Verify immutable PR source checkout
        id: verify-source
        shell: pwsh
        run: |
          if ($env:PR_SOURCE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "Preflight source SHA is invalid."
          }
          $actualSourceSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actualSourceSha -ne $env:PR_SOURCE_SHA) {
            throw "PR source checkout drifted: expected=$env:PR_SOURCE_SHA actual=$actualSourceSha"
          }
      - name: Detect bump-download PR
        id: detect-bump
        shell: pwsh
        run: |
          $isBot = $env:PR_USER_LOGIN -eq "github-actions[bot]"
          $headRef = $env:PR_HEAD_REF
          $title = $env:PR_TITLE
          $isBump = $isBot -and $headRef.StartsWith("bump-download/") -and $title.StartsWith("chore(download): Update manifest for ")
          # PowerShell bool ToString() yields capitalized True/False; emit lowercase
          # so the downstream string comparisons against 'true' are case-exact.
          $isBumpLower = if ($isBump) { "true" } else { "false" }
          "is-bump=$isBumpLower" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Detected bump-download PR: $isBumpLower"
      - name: Compute submodule cache key
        id: submodule-cache-key
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          $content = @()
          $content += Get-Content -Raw .gitmodules
          $content += ""
          # The submodule state prefix (- for uninitialized, ' ' for initialized)
          # differs by working-tree state, so a key derived from that output drifts
          # between the miss and save phases and the cache never hits. Read the
          # committed gitlink SHAs from HEAD instead; they are deterministic.
          $content += git ls-tree HEAD
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $bytes = [System.Text.Encoding]::UTF8.GetBytes(($content -join "`n"))
          $hash = [System.BitConverter]::ToString($sha.ComputeHash($bytes)).Replace("-", "").ToLowerInvariant()
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore submodule cache
        id: restore-submodule-cache
        if: steps.detect-bump.outputs.is-bump != 'true'
        uses: actions/cache@v5
        with:
          path: |
            .git/modules
            hl2sdk_cs2
          key: ${{ runner.os }}-submodules-${{ env.SUBMODULE_CACHE_VERSION }}-${{ steps.submodule-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-submodules-${{ env.SUBMODULE_CACHE_VERSION }}-
      - name: Sync and update submodules
        id: sync-submodules
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw "git submodule sync failed." }
          git submodule update --init --recursive --depth 1 --jobs 8
          if ($LASTEXITCODE -ne 0) { throw "git submodule update failed." }
      - name: Check formatting
        id: format
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          uv run python format_repo_files.py --check
      - name: Bump-download lightweight validation
        id: bump-light
        if: steps.detect-bump.outputs.is-bump == 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          $gamever = (uv run python -c "import yaml; d=yaml.safe_load(open('download.yaml', encoding='utf-8')); print(d['downloads'][-1]['tag'])").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($gamever)) {
            throw "Failed to read latest game version from download.yaml."
          }
          $configPath = Join-Path $env:WORKSPACE "configs\$gamever.yaml"
          if (-not (Test-Path -LiteralPath $configPath -PathType Leaf)) {
            throw "Missing analysis config for bump tag ${gamever}: $configPath"
          }
          Write-Host "Bump-download validation OK: GAMEVER=$gamever config=$configPath"
      - name: Determine release version from PR download config
        id: select-version
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          $gamever = uv run python -c "import yaml; d=yaml.safe_load(open('download.yaml', encoding='utf-8')); print(d['downloads'][-1]['tag'])"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read latest game version from download.yaml."
          }
          $gamever = $gamever.Trim()
          if ([string]::IsNullOrWhiteSpace($gamever)) {
            throw "Latest game version from download.yaml is empty."
          }
          if ($gamever -ne $env:PREFLIGHT_PR_GAMEVER) {
            throw "PR release GAMEVER drifted after preflight: preflight=$env:PREFLIGHT_PR_GAMEVER validate=$gamever"
          }
          "PR_GAMEVER=$gamever" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PR release GAMEVER=$gamever"
      - name: Extract deterministic base snapshot
        id: base-snapshot
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          $baseDir = Join-Path $env:WORKSPACE ".snapshot-base"
          if (Test-Path -LiteralPath $baseDir) {
            Remove-Item -LiteralPath $baseDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $baseDir -Force | Out-Null
          function Export-GitBlob {
            param(
              [Parameter(Mandatory=$true)][string]$Revision,
              [Parameter(Mandatory=$true)][string]$RepoPath,
              [Parameter(Mandatory=$true)][string]$OutputPath
            )
            uv run python -c `
              "import pathlib, subprocess, sys; pathlib.Path(sys.argv[3]).write_bytes(subprocess.check_output(['git', 'show', f'{sys.argv[1]}:{sys.argv[2]}']))" `
              "$Revision" "$RepoPath" "$OutputPath"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to extract $Revision`:$RepoPath"
            }
          }
          $baseRef = $env:PR_BASE_SHA
          if ($baseRef -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid pull request base SHA: $baseRef"
          }
          git cat-file -e "$baseRef^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Pull request base commit is unavailable: $baseRef"
          }
          $baseConfig = Join-Path $baseDir "base-config.yaml"
          $baseSnapshotRepoPath = $env:PREFLIGHT_BASE_SNAPSHOT_PATH
          $baseSnapshotCommit = $env:PREFLIGHT_BASE_SNAPSHOT_COMMIT
          if ([string]::IsNullOrWhiteSpace($baseSnapshotRepoPath)) {
            if (-not [string]::IsNullOrWhiteSpace($baseSnapshotCommit)) {
              throw "Preflight returned a snapshot commit without a snapshot path."
            }
            $baseGamever = ""
            $baseSnapshot = ""
            $hasBaseSnapshot = "false"
            $validationGamever = $env:PR_GAMEVER
            Write-Host "Base commit $baseRef has no snapshot; bootstrap PR validation will rebuild $validationGamever."
          } else {
            if ($baseSnapshotRepoPath -notmatch '^gamesymbols/[^/]+\.yaml$') {
              throw "Invalid preflight snapshot path: $baseSnapshotRepoPath"
            }
            if ($baseSnapshotCommit -notmatch '^[0-9a-f]{40}$') {
              throw "Invalid preflight snapshot commit: $baseSnapshotCommit"
            }
            $baseGamever = [IO.Path]::GetFileNameWithoutExtension($baseSnapshotRepoPath)
            git cat-file -e "$baseSnapshotCommit^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "Preflight snapshot commit is unavailable: $baseSnapshotCommit" }
            $baseSnapshot = Join-Path $baseDir "$baseGamever.yaml"
            $versionedBaseConfig = "configs/$baseGamever.yaml"
            git cat-file -e "$baseSnapshotCommit`:$versionedBaseConfig"
            if ($LASTEXITCODE -eq 0) {
              Export-GitBlob $baseSnapshotCommit $versionedBaseConfig $baseConfig
            } else {
              Export-GitBlob $baseSnapshotCommit "config.yaml" $baseConfig
            }
            Export-GitBlob $baseRef $baseSnapshotRepoPath $baseSnapshot
            $hasBaseSnapshot = "true"
            $validationGamever = $baseGamever
          }
          $headSnapshotRepoPath = "gamesymbols/$validationGamever.yaml"
          $headSnapshot = Join-Path $baseDir "head-$validationGamever.yaml"
          Export-GitBlob "HEAD" $headSnapshotRepoPath $headSnapshot
          $headConfig = Join-Path $env:WORKSPACE "configs\$validationGamever.yaml"
          if (-not (Test-Path -LiteralPath $headConfig -PathType Leaf)) {
            throw "Missing head analysis config: $headConfig"
          }
          if ($validationGamever -ne $env:PREFLIGHT_GAMEVER) {
            throw "PR validation GAMEVER drifted after warmup: preflight=$env:PREFLIGHT_GAMEVER validate=$validationGamever"
          }
          "BASE_REF=$baseRef" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BASE_CONFIG=$baseConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BASE_SNAPSHOT=$baseSnapshot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BASE_GAMEVER=$baseGamever" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HEAD_SNAPSHOT=$headSnapshot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HEAD_CONFIG=$headConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HAS_BASE_SNAPSHOT=$hasBaseSnapshot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GAMEVER=$validationGamever" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PR validation GAMEVER=$validationGamever (release GAMEVER=$env:PR_GAMEVER)"
      - name: Prepare PR bin copy
        id: prepare-bin
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          function Get-BinCopyExcludes {
            param(
              [Parameter(Mandatory=$true)][string]$IgnoreFile
            )
            if (-not (Test-Path -LiteralPath $IgnoreFile -PathType Leaf)) {
              throw "Missing bin ignore file: $IgnoreFile"
            }
            $filePatterns = @()
            $dirPatterns = @()
            $slashChars = [char[]]@("/", "\")
            foreach ($line in Get-Content -LiteralPath $IgnoreFile) {
              $pattern = $line.Trim()
              if ([string]::IsNullOrWhiteSpace($pattern) -or $pattern.StartsWith("#") -or $pattern.StartsWith("!")) {
                continue
              }
              $isDirectoryPattern = $pattern.EndsWith("/") -or $pattern.EndsWith("\")
              $pattern = $pattern.TrimStart($slashChars)
              if ($isDirectoryPattern) {
                $pattern = $pattern.TrimEnd($slashChars)
              }
              if ($pattern.Contains("/") -or $pattern.Contains("\")) {
                throw "Unsupported nested bin ignore pattern for robocopy: $pattern"
              }
              if ($isDirectoryPattern -or $pattern -eq ".git") {
                $dirPatterns += $pattern
              } else {
                $filePatterns += $pattern
              }
            }
            [pscustomobject]@{
              Files = $filePatterns
              Dirs = $dirPatterns
            }
          }
          Set-Location $env:WORKSPACE
          $persistedBinRoot = Join-Path $env:PERSISTED_WORKSPACE "bin"
          $sourceBinGamever = Join-Path $persistedBinRoot $env:GAMEVER
          $workspaceBinRoot = Join-Path $env:WORKSPACE "bin"
          $targetBinGamever = Join-Path $workspaceBinRoot $env:GAMEVER
          if (Test-Path -LiteralPath $workspaceBinRoot) {
            $binItem = Get-Item -LiteralPath $workspaceBinRoot -Force
            if ($binItem.Attributes -band [IO.FileAttributes]::ReparsePoint) {
              throw "Workspace bin must be a real directory for PR validation, not a link: $workspaceBinRoot"
            }
          } else {
            New-Item -ItemType Directory -Path $workspaceBinRoot -Force | Out-Null
          }
          New-Item -ItemType Directory -Path $targetBinGamever -Force | Out-Null
          if (Test-Path -LiteralPath $sourceBinGamever -PathType Container) {
            $excludes = Get-BinCopyExcludes -IgnoreFile (Join-Path $persistedBinRoot ".stignore")
            $excludes.Files = @(
              $excludes.Files + @("*.i64", "*.idb", "*.id0", "*.id1", "*.id2", "*.nam", "*.til") |
                Sort-Object -Unique
            )
            $robocopyArgs = @(
              $sourceBinGamever
              $targetBinGamever
              "/E"
              "/COPY:DAT"
              "/DCOPY:DAT"
              "/R:2"
              "/W:5"
            )
            if ($excludes.Files.Count -gt 0) {
              $robocopyArgs += "/XF"
              $robocopyArgs += $excludes.Files
            }
            if ($excludes.Dirs.Count -gt 0) {
              $robocopyArgs += "/XD"
              $robocopyArgs += $excludes.Dirs
            }
            $robocopyArgs += "/XD"
            $robocopyArgs += "*.bsproj"
            robocopy @robocopyArgs
            $robocopyExitCode = $LASTEXITCODE
            if ($robocopyExitCode -ge 8) {
              throw "Failed to copy persisted bin/$env:GAMEVER into PR workspace; robocopy exit code $robocopyExitCode"
            }
            Write-Host "Copied persisted bin/$env:GAMEVER into PR workspace; robocopy exit code $robocopyExitCode"
            $global:LASTEXITCODE = 0
          } else {
            Write-Host "No accepted persisted bin/$env:GAMEVER exists yet; using the published warm cache as the binary source."
          }
      - name: Resolve consumer IDA identity
        id: resolve-consumer-ida
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          $pythonExe = (Get-Command python -ErrorAction SilentlyContinue).Source
          $idalibMcpExe = (Get-Command idalib-mcp -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($pythonExe) -or [string]::IsNullOrWhiteSpace($idalibMcpExe)) {
            throw "python with idalib and idalib-mcp must both be available on PATH."
          }
          $pythonExe = [IO.Path]::GetFullPath($pythonExe)
          $idalibMcpExe = [IO.Path]::GetFullPath($idalibMcpExe)
          $pythonDir = Split-Path -Parent $pythonExe
          $mcpDir = Split-Path -Parent $idalibMcpExe
          $pythonScriptsDir = Join-Path $pythonDir "Scripts"
          if (-not [StringComparer]::OrdinalIgnoreCase.Equals($mcpDir, $pythonDir) -and `
              -not [StringComparer]::OrdinalIgnoreCase.Equals($mcpDir, $pythonScriptsDir)) {
            throw "python and idalib-mcp resolve to different installations: python=$pythonExe idalib-mcp=$idalibMcpExe"
          }
          $idaVersion = (& $pythonExe warmup_idb_worker.py --print-ida-version).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($idaVersion)) {
            throw "Failed to resolve the consumer IDA kernel version."
          }
          "IDA_VERSION=$idaVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore required published warm IDB cache
        id: restore-idb-cache
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          uv run python idb_cache.py restore `
            --repo-root "$env:WORKSPACE" `
            --persisted-root "$env:PERSISTED_WORKSPACE" `
            --gamever "$env:GAMEVER" `
            --generation "$env:IDB_CACHE_GENERATION" `
            --cache-key "$env:IDB_CACHE_KEY" `
            --ida-version "$env:IDA_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Required published IDB cache restore failed." }
      - name: Restore deterministic base and invalidate affected outputs
        id: restore-base
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          function Clear-BootstrapYaml {
            $gameRoot = [IO.Path]::GetFullPath((Join-Path $env:WORKSPACE "bin\$env:GAMEVER"))
            $workspaceRoot = [IO.Path]::GetFullPath($env:WORKSPACE)
            $workspacePrefix = $workspaceRoot.TrimEnd('\') + '\'
            if (-not $gameRoot.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Resolved game root is outside PR workspace: $gameRoot"
            }
            if (-not (Test-Path -LiteralPath $gameRoot -PathType Container)) {
              throw "Current game root does not exist: $gameRoot"
            }
            $current = $gameRoot
            while ($current.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
              $item = Get-Item -LiteralPath $current -Force
              if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw "Bootstrap cleanup path must not traverse a reparse point: $current"
              }
              if ($current -eq $workspaceRoot) {
                break
              }
              $current = Split-Path -Parent $current
            }
            Get-ChildItem -LiteralPath $gameRoot -Recurse -File -Filter "*.yaml" |
              ForEach-Object { Remove-Item -LiteralPath $_.FullName -Force }
            Write-Host "Bootstrap validation: cleared persisted YAML for $env:GAMEVER."
          }
          $baselineMode = "absent-bootstrap"
          $baselineReason = "base_snapshot_absent"
          if ($env:HAS_BASE_SNAPSHOT -eq "true") {
            $probeLines = @(
              & uv run gamesymbol_snapshot.py check-contract `
                -gamever "$env:GAMEVER" `
                -bindir bin `
                -configyaml "$env:BASE_CONFIG" `
                -snapshot "$env:BASE_SNAPSHOT" `
                -json
            )
            $probeExitCode = $LASTEXITCODE
            $probeText = ($probeLines -join "`n").Trim()
            if ($probeExitCode -eq 0) {
              try {
                $probe = $probeText | ConvertFrom-Json
              } catch {
                throw "Baseline contract probe returned invalid JSON: $probeText"
              }
              if ($probe.trusted -ne $true -or $probe.reason -ne "trusted") {
                throw "Baseline contract probe returned an invalid trusted result: $probeText"
              }
              $baselineMode = "trusted-incremental"
              $baselineReason = "trusted"
            } elseif ($probeExitCode -eq 3) {
              try {
                $probe = $probeText | ConvertFrom-Json
              } catch {
                throw "Baseline contract probe returned invalid JSON: $probeText"
              }
              if ($probe.trusted -ne $false -or [string]::IsNullOrWhiteSpace([string]$probe.reason)) {
                throw "Baseline contract probe returned an invalid untrusted result: $probeText"
              }
              $baselineMode = "untrusted-bootstrap"
              $baselineReason = [string]$probe.reason
              Write-Output "::warning title=Baseline snapshot rejected::reason=$baselineReason; incremental validation disabled; falling back to clean full rebuild"
              Clear-BootstrapYaml
              $env:HAS_BASE_SNAPSHOT = "false"
              "HAS_BASE_SNAPSHOT=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            } else {
              throw "Baseline contract probe failed with exit code $probeExitCode`: $probeText"
            }
          }
          if ($baselineMode -eq "trusted-incremental") {
            uv run gamesymbol_snapshot.py restore `
              -gamever "$env:GAMEVER" `
              -bindir bin `
              -configyaml "$env:BASE_CONFIG" `
              -snapshot "$env:BASE_SNAPSHOT" `
              -replace
            if ($LASTEXITCODE -ne 0) {
              throw "Base snapshot restore failed with exit code $LASTEXITCODE"
            }
            uv run gamesymbol_pr_validation.py invalidate `
              -gamever "$env:GAMEVER" `
              -bindir bin `
              -baseconfigyaml "$env:BASE_CONFIG" `
              -basesnapshot "$env:BASE_SNAPSHOT" `
               -headconfigyaml "$env:HEAD_CONFIG" `
              -headsnapshot "$env:HEAD_SNAPSHOT" `
              -baseref "$env:BASE_REF" `
              -headref "HEAD"
            if ($LASTEXITCODE -ne 0) {
              throw "gamesymbol_pr_validation.py failed with exit code $LASTEXITCODE"
            }
          } elseif ($baselineMode -eq "absent-bootstrap") {
            Clear-BootstrapYaml
          }
          "BASELINE_MODE=$baselineMode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @(
            "Baseline mode: $baselineMode"
            "Validation game version: $env:GAMEVER"
            "Reason: $baselineReason"
            "Incremental invalidation: $(if ($baselineMode -eq 'trusted-incremental') { 'enabled' } else { 'disabled' })"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Run Python test suites
        id: test-suites
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          foreach ($suite in @('unit', 'repository-contract', 'redis-integration', 'release-integration', 'all')) {
            uv run python tests/run_test_suite.py $suite -b --durations 30
            if ($LASTEXITCODE -ne 0) { throw "Repository test suite failed: $suite" }
          }
      - name: Analyze binaries
        id: analyze
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
           uv run ida_analyze_bin.py -gamever "$env:GAMEVER" -configyaml "$env:HEAD_CONFIG" -require_warm_idb -debug
          if ($LASTEXITCODE -ne 0) {
            throw "ida_analyze_bin.py failed with exit code $LASTEXITCODE"
          }
      - name: Build actual candidate snapshot
        id: build-snapshot
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          $candidateRoot = Join-Path $env:RUNNER_TEMP "gamesymbol-candidates\pr-$env:PR_NUMBER-${{ github.run_id }}-${{ github.run_attempt }}"
          New-Item -ItemType Directory -Path $candidateRoot -Force | Out-Null
          $candidate = Join-Path $candidateRoot "$env:GAMEVER.yaml"
          $session = Join-Path $candidateRoot "$env:GAMEVER.session.json"
          "CANDIDATE_ROOT=$candidateRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACTUAL_CANDIDATE_SNAPSHOT=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_SESSION=$session" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          uv run gamesymbol_candidate.py build `
            -gamever "$env:GAMEVER" `
            -bindir bin `
             -configyaml "$env:HEAD_CONFIG" `
            -output "$candidate" `
            -session "$session"
          if ($LASTEXITCODE -ne 0) {
            throw "candidate build failed with exit code $LASTEXITCODE"
          }
      - name: Compare actual candidate with PR head snapshot
        id: compare-snapshot
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          uv run gamesymbol_candidate.py compare `
            -gamever "$env:GAMEVER" `
            -candidate "$env:ACTUAL_CANDIDATE_SNAPSHOT" `
            -expected "$env:HEAD_SNAPSHOT" `
             -configyaml "$env:HEAD_CONFIG" `
            -session "$env:CANDIDATE_SESSION"
          if ($LASTEXITCODE -ne 0) {
            throw "candidate/head comparison failed with exit code $LASTEXITCODE"
          }
      - name: Build isolated versioned gamedata candidate
        id: build-gamedata
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          uv run gamesymbol_candidate.py guard -candidate "$env:ACTUAL_CANDIDATE_SNAPSHOT" -session "$env:CANDIDATE_SESSION"
          if ($LASTEXITCODE -ne 0) { throw "candidate guard failed before gamedata" }
          $gamedataRoot = Join-Path $env:CANDIDATE_ROOT "gamedata-candidate"
          $gamedataSession = Join-Path $env:CANDIDATE_ROOT "$env:GAMEVER.gamedata.session.json"
          $env:GAMEDATA_SESSION = $gamedataSession
          "GAMEDATA_SESSION=$gamedataSession" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          uv run gamedata_candidate.py build -gamever "$env:GAMEVER" `
            -build-id "${{ github.run_id }}-${{ github.run_attempt }}" `
            -snapshot "$env:ACTUAL_CANDIDATE_SNAPSHOT" -configyaml "$env:HEAD_CONFIG" `
            -candidate-root "$gamedataRoot" -session "$gamedataSession" -debug
          if ($LASTEXITCODE -ne 0) { throw "gamedata candidate build failed with exit code $LASTEXITCODE" }
          uv run gamedata_candidate.py guard -session "$gamedataSession"
          if ($LASTEXITCODE -ne 0) { throw "gamedata candidate guard failed" }
          uv run gamedata_candidate.py verify-tracked `
            -session "$env:GAMEDATA_SESSION" `
            -gamever "$env:GAMEVER" `
            -candidate "$env:ACTUAL_CANDIDATE_SNAPSHOT" `
            -configyaml "$env:HEAD_CONFIG" `
            -repo-root "$env:WORKSPACE" `
            -revision HEAD
          if ($LASTEXITCODE -ne 0) { throw "tracked gamedata verification failed" }
          uv run gamesymbol_candidate.py guard -candidate "$env:ACTUAL_CANDIDATE_SNAPSHOT" -session "$env:CANDIDATE_SESSION"
          if ($LASTEXITCODE -ne 0) { throw "candidate guard failed after gamedata" }
          uv run gamesymbol_candidate.py mark -candidate "$env:ACTUAL_CANDIDATE_SNAPSHOT" -session "$env:CANDIDATE_SESSION" -step gamedata
          if ($LASTEXITCODE -ne 0) { throw "failed to mark gamedata validation" }
      - name: Select versioned SDK for C++ ABI validation
        id: select-sdk
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          $sdkPath = Join-Path $env:WORKSPACE "hl2sdk_cs2"
          $safeSdkPath = ([IO.Path]::GetFullPath($sdkPath) -replace '\\', '/')
          git config --global --add safe.directory "$safeSdkPath"
          if ($LASTEXITCODE -ne 0) { throw "Failed to trust hl2sdk_cs2 Git directory." }
          $sdkRef = "cs2-$env:GAMEVER"
          $sdkRemote = "https://github.com/HLND2T/hl2sdk.git"
          $pinnedSha = (git -C $sdkPath rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $pinnedSha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Unable to resolve the pinned hl2sdk_cs2 commit."
          }
          "SDK_PINNED_SHA=$pinnedSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $remoteBranch = git -C $sdkPath ls-remote --heads $sdkRemote "refs/heads/$sdkRef"
          if ($LASTEXITCODE -ne 0) { throw "Unable to query $sdkRef from hl2sdk." }
          if ([string]::IsNullOrWhiteSpace($remoteBranch)) {
            "SDK_ABI_REF=pinned-submodule" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            "SDK_ABI_SHA=$pinnedSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            "SDK_ABI_SWITCHED=false" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "No versioned SDK branch exists for $sdkRef; retaining the pinned submodule revision."
            Write-Host "C++ ABI SDK selection: GAMEVER=$env:GAMEVER; ref=pinned-submodule; selected SHA=$pinnedSha; pinned SHA=$pinnedSha"
          } else {
            $remoteSha = ($remoteBranch -split '\s+')[0]
            if ($remoteSha -notmatch '^[0-9a-fA-F]{40}$') { throw "Invalid commit returned for $sdkRef." }
            git -C $sdkPath fetch --no-tags --depth 1 $sdkRemote "refs/heads/$sdkRef"
            if ($LASTEXITCODE -ne 0) { throw "Unable to fetch $sdkRef from hl2sdk." }
            $fetchedSha = (git -C $sdkPath rev-parse FETCH_HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $fetchedSha -ne $remoteSha) {
              throw "Fetched commit for $sdkRef does not match the queried remote commit."
            }
            "SDK_ABI_SWITCHED=true" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            git -C $sdkPath checkout --detach $remoteSha
            if ($LASTEXITCODE -ne 0) { throw "Unable to checkout $sdkRef." }
            $selectedSha = (git -C $sdkPath rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $selectedSha -ne $remoteSha) {
              throw "Selected SDK commit does not match $sdkRef."
            }
            "SDK_ABI_REF=$sdkRef" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            "SDK_ABI_SHA=$selectedSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "C++ ABI SDK selection: GAMEVER=$env:GAMEVER; ref=$sdkRef; selected SHA=$selectedSha; pinned SHA=$pinnedSha"
          }
      - name: Run C++ tests
        id: cpp-tests
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          uv run gamesymbol_candidate.py guard -candidate "$env:ACTUAL_CANDIDATE_SNAPSHOT" -session "$env:CANDIDATE_SESSION"
          if ($LASTEXITCODE -ne 0) { throw "candidate guard failed before C++ tests" }
           uv run run_cpp_tests.py -gamever "$env:GAMEVER" -snapshot "$env:ACTUAL_CANDIDATE_SNAPSHOT" -configyaml "$env:HEAD_CONFIG" -debug
          if ($LASTEXITCODE -ne 0) {
            throw "run_cpp_tests.py failed with exit code $LASTEXITCODE"
          }
          uv run gamesymbol_candidate.py guard -candidate "$env:ACTUAL_CANDIDATE_SNAPSHOT" -session "$env:CANDIDATE_SESSION"
          if ($LASTEXITCODE -ne 0) { throw "candidate guard failed after C++ tests" }
          uv run gamesymbol_candidate.py mark -candidate "$env:ACTUAL_CANDIDATE_SNAPSHOT" -session "$env:CANDIDATE_SESSION" -step cpp_tests
          if ($LASTEXITCODE -ne 0) { throw "failed to mark C++ validation" }
      - name: Restore pinned SDK revision
        id: restore-sdk
        if: always()
        shell: pwsh
        run: |
          if ($env:SDK_ABI_SWITCHED -ne "true") {
            Write-Host "C++ ABI SDK restore: pinned submodule revision remained selected."
            exit 0
          }
          if ($env:SDK_PINNED_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "SDK_PINNED_SHA is unavailable or invalid."
          }
          $sdkPath = Join-Path $env:WORKSPACE "hl2sdk_cs2"
          git -C $sdkPath checkout --detach "$env:SDK_PINNED_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Unable to restore pinned hl2sdk_cs2 commit." }
          $restoredSha = (git -C $sdkPath rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $restoredSha -ne $env:SDK_PINNED_SHA) {
            throw "Restored SDK commit does not match SDK_PINNED_SHA."
          }
          Write-Host "C++ ABI SDK restore: restored pinned SHA=$restoredSha"
      - name: Mark snapshot validation success
        id: mark-success
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          "validated" | Out-File -LiteralPath ".snapshot-validation-success" -Encoding ascii
      - name: Stage analyzed YAML for merge promotion
        id: stage-yaml
        if: steps.detect-bump.outputs.is-bump != 'true'
        shell: pwsh
        run: |
          Set-Location $env:WORKSPACE
          $gameRoot = [IO.Path]::GetFullPath((Join-Path $env:WORKSPACE "bin\$env:GAMEVER"))
          $workspaceRoot = [IO.Path]::GetFullPath($env:WORKSPACE)
          $workspacePrefix = $workspaceRoot.TrimEnd('\') + '\'
          if (-not $gameRoot.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Resolved game root is outside the validation workspace: $gameRoot"
          }
          if (-not (Test-Path -LiteralPath $gameRoot -PathType Container)) {
            throw "Current game root does not exist: $gameRoot"
          }
          $stagingRoot = Join-Path $env:PERSISTED_WORKSPACE "pr-yaml-staging"
          $prStaging = Join-Path $stagingRoot $env:PR_NUMBER
          $runStaging = Join-Path $prStaging "${{ github.run_id }}-${{ github.run_attempt }}"
          New-Item -ItemType Directory -Path $runStaging -Force | Out-Null

          # Record the GAMEVER so the merge finalizer can route this run's
          # analyzed YAML back to the correct persisted bin directory.
          $env:GAMEVER | Out-File -LiteralPath (Join-Path $runStaging "gamever.txt") -Encoding ascii

          # Only the analyzed *.yaml artifacts are staged; *.i64 databases are
          # not persisted by the PR pipeline anymore.
          robocopy $gameRoot $runStaging "*.yaml" /S /COPY:DAT /DCOPY:DAT /R:2 /W:5
          $rc = $LASTEXITCODE
          if ($rc -ge 8) {
            throw "Failed to stage analyzed YAML for GAMEVER=$env:GAMEVER; robocopy exit code $rc"
          }
          $global:LASTEXITCODE = 0
          Write-Host "Staged analyzed YAML for GAMEVER=$env:GAMEVER into $runStaging"
      - name: Clean candidate session
        id: cleanup
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CANDIDATE_ROOT) -and (Test-Path -LiteralPath $env:CANDIDATE_ROOT)) {
            Remove-Item -LiteralPath $env:CANDIDATE_ROOT -Recurse -Force
          }
  finalize-pr-workspace:
    if: >-
      github.event.action == 'closed' &&
      (github.repository == 'HLND2T/CS2_VibeSignatures' ||
       github.repository == 'hzqst/CS2_VibeSignatures') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        startsWith(github.event.pull_request.head.ref, 'bump-download/') &&
        startsWith(github.event.pull_request.title, 'chore(download): Update manifest for ')) &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        startsWith(github.event.pull_request.head.ref, 'gamesymbols/build/') &&
        startsWith(github.event.pull_request.title, 'chore(gamesymbols): publish '))
    environment: win64-cleanup
    runs-on: [self-hosted, windows, x64]
    env:
      PERSISTED_WORKSPACE: ${{ secrets.PERSISTED_WORKSPACE }}
    steps:
      - name: Promote staged YAML on merge
        id: finalize-workspace
        shell: pwsh
        run: |-
          $prNumber = "${{ github.event.pull_request.number }}"
          $prWasMerged = "${{ github.event.pull_request.merged }}"
          if ([string]::IsNullOrWhiteSpace($prNumber)) {
            throw "Unable to determine pull request number."
          }
          $prStaging = [IO.Path]::GetFullPath((Join-Path $env:PERSISTED_WORKSPACE "pr-yaml-staging\$prNumber"))
          if (-not (Test-Path -LiteralPath $prStaging -PathType Container)) {
            if ($prWasMerged -eq "true") {
              throw "Merged PR has no staged YAML directory: $prStaging"
            }
            Write-Host "No staged YAML for PR $prNumber; nothing to promote."
            exit 0
          }
          if ($prWasMerged -eq "true") {
            # Prefer the latest successful validate run. Directory names are
            # "<run_id>-<run_attempt>"; sort numerically (a lexicographic sort
            # would mis-order 1000 vs 999).
            $latestRun = Get-ChildItem -LiteralPath $prStaging -Directory |
              Sort-Object @{ Expression = { [long](($_.Name -split '-')[0]) }; Descending = $true },
                          @{ Expression = { [int](($_.Name -split '-')[1]) }; Descending = $true } |
              Select-Object -First 1
            if (-not $latestRun) {
              throw "Merged PR has staged YAML directory but no run subdirectories: $prStaging"
            }
            $gameverMarker = Join-Path $latestRun.FullName "gamever.txt"
            if (-not (Test-Path -LiteralPath $gameverMarker -PathType Leaf)) {
              throw "Staged run is missing gamever.txt: $latestRun.FullName"
            }
            $gamever = (Get-Content -LiteralPath $gameverMarker -Raw).Trim()
            if ([string]::IsNullOrWhiteSpace($gamever)) {
              throw "Staged run has an empty gamever marker: $latestRun.FullName"
            }
            $targetGamever = Join-Path $env:PERSISTED_WORKSPACE "bin\$gamever"
            New-Item -ItemType Directory -Path $targetGamever -Force | Out-Null
            robocopy $latestRun.FullName $targetGamever "*.yaml" /S /COPY:DAT /DCOPY:DAT /R:2 /W:5 /XF gamever.txt
            $rc = $LASTEXITCODE
            if ($rc -ge 8) {
              throw "Failed to promote staged YAML for GAMEVER=$gamever; robocopy exit code $rc"
            }
            $global:LASTEXITCODE = 0
            Write-Host "Promoted validated YAML for GAMEVER=$gamever into $targetGamever"
          } else {
            Write-Host "PR $prNumber was closed without merging; skipping YAML promotion."
          }
          Remove-Item -LiteralPath $prStaging -Recurse -Force
          Write-Host "Removed staged YAML directory: $prStaging"
