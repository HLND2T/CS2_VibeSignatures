name: Trusted Source Artifact GAMEVER Validation
on:
  workflow_call:
    inputs:
      gamever:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      plan_sha256:
        required: true
        type: string
      plan_artifact_name:
        required: true
        type: string
permissions:
  actions: read
  contents: read
env:
  CS2VIBE_STRING_MIN_LENGTH: '4'
jobs:
  bootstrap-reuse:
    runs-on: ubuntu-latest
    outputs:
      reused: ${{ steps.probe.outputs.reused }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base_sha }}
          path: .trusted-tools
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --project .trusted-tools --locked
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ runner.temp }}/trusted-pr-plan
      - name: Authenticate and rebind prior bootstrap execution
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          GAMEVER: ${{ inputs.gamever }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
        shell: bash
        run: |
          if [[ ! -f .trusted-tools/bootstrap_reuse.py ]]; then
            echo 'reused=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run --project .trusted-tools python .trusted-tools/bootstrap_reuse.py probe \
            --repo-root "$GITHUB_WORKSPACE" --gamever "$GAMEVER" \
            --plan "$RUNNER_TEMP/trusted-pr-plan/trusted-source-artifact-plan.json" \
            --plan-sha256 "$PLAN_SHA256" --evidence "$RUNNER_TEMP/bootstrap-reuse.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload current-tree bootstrap reuse evidence
        if: steps.probe.outputs.reused == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-reuse-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.gamever }}
          path: ${{ runner.temp }}/bootstrap-reuse.json
          retention-days: 7
          if-no-files-found: error
  warmup-idb:
    needs: bootstrap-reuse
    if: needs.bootstrap-reuse.outputs.reused != 'true'
    uses: ./.github/workflows/warmup-idb.yml
    with:
      gamever: ${{ inputs.gamever }}
      source_sha: ${{ inputs.source_sha }}
    secrets: inherit
  validate:
    needs: [bootstrap-reuse, warmup-idb]
    if: >-
      always() && !cancelled() && needs.bootstrap-reuse.result == 'success' &&
      (needs.warmup-idb.result == 'success' ||
      (needs.bootstrap-reuse.outputs.reused == 'true' && needs.warmup-idb.result == 'skipped'))
    environment: win64
    runs-on: [self-hosted, cross-platform]
    env:
      GAMEVER: ${{ inputs.gamever }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PLAN_SHA256: ${{ inputs.plan_sha256 }}
      BINARY_LOCK_SHA256: ${{ needs.warmup-idb.outputs.binary_lock_sha256 }}
      IDB_CACHE_GENERATION: ${{ needs.warmup-idb.outputs.generation }}
      IDB_CACHE_KEY: ${{ needs.warmup-idb.outputs.cache_key }}
      IDB_CACHE_LEASE_ID: ${{ needs.warmup-idb.outputs.lease_id }}
      IDB_CACHE_LEASE_SHA256: ${{ needs.warmup-idb.outputs.lease_sha256 }}
      CI_CACHE_ROOT: ${{ github.workspace }}/.ci-cache/store
      CS2VIBE_AGENT: ${{ secrets.CS2VIBE_AGENT }}
      CS2VIBE_AGENT_MODEL: ${{ secrets.CS2VIBE_AGENT_MODEL }}
      CS2VIBE_LLM_APIKEY: ${{ secrets.CS2VIBE_LLM_APIKEY }}
      CS2VIBE_LLM_BASEURL: ${{ secrets.CS2VIBE_LLM_BASEURL }}
      CS2VIBE_LLM_EFFORT: ${{ secrets.CS2VIBE_LLM_EFFORT }}
      CS2VIBE_LLM_FAKE_AS: ${{ secrets.CS2VIBE_LLM_FAKE_AS }}
      CS2VIBE_LLM_MODEL: ${{ secrets.CS2VIBE_LLM_MODEL }}
      DEPOTDOWNLOADER_STEAM_USERNAME: ${{ secrets.DEPOTDOWNLOADER_STEAM_USERNAME }}
      DEPOTDOWNLOADER_STEAM_PASSWORD: ${{ secrets.DEPOTDOWNLOADER_STEAM_PASSWORD }}
      CI_KIND: pr
      PYTHONUTF8: '1'
      BOOTSTRAP_REUSED: ${{ needs.bootstrap-reuse.outputs.reused }}
    steps:
      - name: Checkout exact prospective merge tree as data
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: hzqst/setup-uv@ed37cb7af6cd89cb8e2ea2f20674ba1d05dc7b35 # S3 cache backend
        with:
          # enable-cache: auto resolves to false on self-hosted runners, so the uv
          # cache is shared through the existing repository S3 bucket instead.
          enable-cache: true
          cache-s3-bucket: actions-cache-cs2-vibesignatures
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      - name: Checkout cache transport tools from workflow source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .cache-tools
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout trusted base verification tools
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          path: .trusted-tools
      - name: Sync trusted verification environment
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: sync-trusted
      - name: Download bound trusted plan
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ runner.temp }}/trusted-pr-plan
      - name: Download hosted bootstrap reuse evidence
        if: needs.bootstrap-reuse.outputs.reused == 'true'
        uses: actions/download-artifact@v5
        with:
          name: bootstrap-reuse-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.gamever }}
          path: ${{ runner.temp }}/trusted-bootstrap-reuse
      - name: Prepare clean job-local cache layout
        id: s3-layout
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-prepare
      - name: Restore accepted binaries from S3
        id: s3-accepted
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-layout.outputs.accepted-key }}
          path: ${{ steps.s3-layout.outputs.accepted-path }}
          restore-keys: ${{ steps.s3-layout.outputs.accepted-restore-keys }}
      - name: Restore depot binaries from S3
        id: s3-depot
        if: steps.s3-accepted.outputs.cache-restored != 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-layout.outputs.depot-key }}
          path: ${{ steps.s3-layout.outputs.depot-path }}
          restore-keys: ${{ steps.s3-layout.outputs.depot-restore-keys }}
      - name: Verify restored binary caches against source lock
        env:
          CACHE_ACCEPTED_HIT: ${{ steps.s3-accepted.outputs.cache-restored }}
          CACHE_DEPOT_HIT: ${{ steps.s3-depot.outputs.cache-restored }}
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-verify-restored
      - name: Validate source, plan, and binary-only workspace
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: accepted-restore
      - name: Stage verified accepted binaries for S3
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: accepted-stage
      - name: Save verified accepted binaries to S3
        if: steps.s3-accepted.outputs.cache-hit != 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-layout.outputs.accepted-key }}
          path: ${{ steps.s3-layout.outputs.accepted-path }}
      - name: Check configured depot files for publication
        id: s3-depot-ready
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-depot-ready
      - name: Save verified depot binaries to S3
        if: steps.s3-depot.outputs.cache-hit != 'true' && steps.s3-depot-ready.outputs.ready == 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-layout.outputs.depot-key }}
          path: ${{ steps.s3-layout.outputs.depot-path }}
      - name: Resolve exact S3 generation and lease paths
        id: s3-selection
        if: needs.bootstrap-reuse.outputs.reused != 'true'
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-selection
      - name: Restore exact warm IDB payload from S3
        id: s3-generation
        if: needs.bootstrap-reuse.outputs.reused != 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-selection.outputs.generation-key }}
          path: ${{ steps.s3-selection.outputs.generation-path }}
          required: 'true'
      - name: Restore current-run IDB lease from S3
        id: s3-lease
        if: needs.bootstrap-reuse.outputs.reused != 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-selection.outputs.lease-key }}
          path: ${{ steps.s3-selection.outputs.lease-path }}
          required: 'true'
      - name: Resolve and restore exact warm IDB generation
        if: needs.bootstrap-reuse.outputs.reused != 'true'
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: idb-restore
      - name: Bind rebuild and failure evidence paths
        id: rebuild-paths
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: pr-paths
      - name: Prepare checkout-external trusted rebuild
        id: prepare-rebuild
        env:
          CI_STAGING: ${{ steps.rebuild-paths.outputs.staging }}
          CI_DIAGNOSTICS: ${{ steps.rebuild-paths.outputs.diagnostics }}
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: pr-prepare
      - name: Execute the trusted plan closure from the prepared artifact root
        id: execute-rebuild
        if: needs.bootstrap-reuse.outputs.reused != 'true'
        env:
          CI_CONFIG: ${{ steps.prepare-rebuild.outputs.config }}
          CI_ACTUAL_ROOT: ${{ steps.prepare-rebuild.outputs.actual-root }}
          CI_EXECUTION_REPORT: ${{ steps.prepare-rebuild.outputs.execution-report }}
          CI_STRATEGY: ${{ steps.prepare-rebuild.outputs.strategy }}
          CI_SELECTED_MANIFEST: ${{ steps.prepare-rebuild.outputs.selected-manifest }}
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: pr-execute
      - name: Upload platform analysis logs and execution records
        if: always() && steps.execute-rebuild.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: pr-platform-analysis-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.GAMEVER }}
          path: |
            ${{ runner.temp }}/pr-platform-analysis-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.GAMEVER }}/*.log
            ${{ runner.temp }}/pr-platform-analysis-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.GAMEVER }}/summary.json
            ${{ runner.temp }}/pr-platform-analysis-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.GAMEVER }}/**/worker.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify execution evidence and exact Git bytes
        id: verify-rebuild
        if: needs.bootstrap-reuse.outputs.reused != 'true'
        env:
          CI_PLAN: ${{ steps.prepare-rebuild.outputs.plan }}
          CI_PREPARATION: ${{ steps.prepare-rebuild.outputs.preparation }}
          CI_VERIFICATION: ${{ steps.prepare-rebuild.outputs.verification }}
          CI_STAGING: ${{ steps.rebuild-paths.outputs.staging }}
          CI_DIAGNOSTICS: ${{ steps.rebuild-paths.outputs.diagnostics }}
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: pr-verify
      - name: Build and validate downstream candidates
        id: downstream
        env:
          CI_CONFIG: ${{ steps.prepare-rebuild.outputs.config }}
          CI_ACTUAL_ROOT: ${{ steps.prepare-rebuild.outputs.actual-root }}
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: downstream
      - name: Upload immutable hosted C++ inputs
        id: cpp-validation
        uses: actions/upload-artifact@v4
        with:
          name: cpp-input-pr-${{ inputs.gamever }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.downstream.outputs.cpp-input-root }}
          if-no-files-found: error
          retention-days: 14
      - name: Collect partial rebuild evidence on failure
        id: collect-failure
        if: >-
          failure() && (steps.prepare-rebuild.outcome == 'failure' || steps.execute-rebuild.outcome == 'failure' ||
          steps.verify-rebuild.outcome == 'failure' || steps.downstream.outcome == 'failure' || steps.cpp-validation.outcome
          == 'failure')
        continue-on-error: true
        env:
          CI_PLAN: ${{ steps.rebuild-paths.outputs.plan }}
          CI_STAGING: ${{ steps.rebuild-paths.outputs.staging }}
          CI_DIAGNOSTICS: ${{ steps.rebuild-paths.outputs.diagnostics }}
          CI_PREPARE_OUTCOME: ${{ steps.prepare-rebuild.outcome }}
          CI_EXECUTE_OUTCOME: ${{ steps.execute-rebuild.outcome }}
          CI_VERIFY_OUTCOME: ${{ steps.verify-rebuild.outcome }}
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: pr-diagnose
      - name: Upload failed rebuild diagnostics
        if: >-
          failure() && steps.collect-failure.outputs.diagnostics != '' &&
          (steps.prepare-rebuild.outcome == 'failure' || steps.execute-rebuild.outcome == 'failure' ||
          steps.verify-rebuild.outcome == 'failure' || steps.downstream.outcome == 'failure' || steps.cpp-validation.outcome
          == 'failure')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trusted-pr-rebuild-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.gamever }}
          path: ${{ steps.collect-failure.outputs.diagnostics }}/**
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload bound rebuild evidence
        uses: actions/upload-artifact@v4
        with:
          name: trusted-pr-rebuild-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.gamever }}
          path: |
            ${{ steps.prepare-rebuild.outputs.preparation }}
            ${{ steps.prepare-rebuild.outputs.execution-report }}
            ${{ steps.prepare-rebuild.outputs.verification }}
          if-no-files-found: error
          retention-days: 7
    outputs:
      cpp_artifact_id: ${{ steps.cpp-validation.outputs.artifact-id }}
      cpp_artifact_digest: ${{ steps.cpp-validation.outputs.artifact-digest }}
  cpp-validation:
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    needs: validate
    uses: ./.github/workflows/cpp-validation.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      gamever: ${{ inputs.gamever }}
      artifact_id: ${{ needs.validate.outputs.cpp_artifact_id }}
      artifact_digest: ${{ needs.validate.outputs.cpp_artifact_digest }}
      scope: pr
      input_path: .
