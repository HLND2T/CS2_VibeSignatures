name: Build On Self Runner
run-name: ${{ inputs.source_artifact_mode == 'full-rebuild' && 'Full-rebuild release' || 'Release' }} ${{
  inputs.publication_mode || 'publish' }} ${{ inputs.gamever || github.event.client_payload.gamever }}
on:
  workflow_call:
    inputs:
      gamever:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      source_pull_request:
        required: true
        type: number
      publication_mode:
        required: true
        type: string
      source_artifact_mode:
        description: Rebuild with optional prior-version reuse, or bind the tracked source-owned artifacts
        required: false
        type: string
        default: rebuild
  workflow_dispatch:
    inputs:
      source_artifact_mode:
        description: Rebuild with prior-version reuse, or rebuild without old-version artifacts
        required: true
        type: choice
        options:
          - rebuild
          - full-rebuild
        default: rebuild
      gamever:
        description: Game version from download.yaml
        required: true
        type: string
      source_sha:
        description: Full immutable commit SHA reachable from the default branch
        required: true
        type: string
      publication_mode:
        description: Verify candidates without publishing, or run the protected publishers
        required: true
        type: choice
        options:
          - verify-only
          - publish
          - republish
        default: verify-only
  repository_dispatch:
    types: [build-on-self-runner]
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.gamever || github.event.client_payload.gamever }}
  cancel-in-progress: false
env:
  CS2VIBE_STRING_MIN_LENGTH: '4'
jobs:
  preflight:
    if: github.repository == 'HLND2T/CS2_VibeSignatures'
    runs-on: ubuntu-latest
    outputs:
      gamever: ${{ steps.resolve.outputs.gamever }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_publish_time: ${{ steps.resolve.outputs.source_publish_time }}
      publication_mode: ${{ steps.resolve.outputs.publication_mode }}
      binary_lock_sha256: ${{ steps.resolve.outputs.binary_lock_sha256 }}
    steps:
      - name: Checkout default branch for trust validation
        id: checkout-trust
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        id: setup-uv
      - name: Resolve and validate dispatch contract
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $gamever = "${{ inputs.gamever || github.event.client_payload.gamever }}"
          $sourceSha = "${{ inputs.source_sha || github.event.client_payload.source_sha }}"
          $sourcePullRequest = "${{ inputs.source_pull_request || github.event.client_payload.source_pull_request }}"
          $sourceArtifactMode = "${{ inputs.source_artifact_mode || 'rebuild' }}"
          if ($sourceArtifactMode -notin @('rebuild', 'full-rebuild', 'tracked')) {
            throw "Unsupported source artifact mode: $sourceArtifactMode"
          }
          $publicationMode = if ("${{ github.event_name }}" -in @('workflow_dispatch', 'workflow_call')) {
            "${{ inputs.publication_mode }}"
          } else {
            "publish"
          }
          if ($publicationMode -notin @('verify-only', 'publish', 'republish')) {
            throw "Unsupported release publication mode: $publicationMode"
          }
          if ($publicationMode -eq 'republish' -and "${{ github.event_name }}" -ne 'workflow_dispatch') {
            throw "Republish requires a manual workflow_dispatch."
          }
          git fetch origin --tags --force "+refs/heads/*:refs/remotes/origin/*"
          git checkout --detach "$sourceSha"
          if ($LASTEXITCODE -ne 0) { throw "Unable to checkout immutable release source." }
          $preflightJson = uv run python release_source_preflight.py --repo-root "${{ github.workspace }}" `
            --repository "${{ github.repository }}" --gamever "$gamever" `
            --source-sha "$sourceSha" --default-ref "origin/${{ github.event.repository.default_branch }}"
          if ($LASTEXITCODE -ne 0) { throw "Immutable release source preflight failed." }
          # -DateKind String keeps source_publish_time a raw ISO-8601 string; the default parses it into [datetime]
          $preflight = $preflightJson | ConvertFrom-Json -DateKind String
          if ($preflight.source_sha -ne $sourceSha -or `
              $preflight.source_publish_time -notmatch '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$') {
            throw "Immutable release source preflight output is invalid."
          }
          if ("${{ github.event_name }}" -in @('repository_dispatch', 'workflow_call') -and `
              "${{ inputs.source_artifact_mode }}" -ne 'tracked') {
            if ($sourcePullRequest -notmatch '^[1-9][0-9]*$') {
              throw "repository_dispatch requires a numeric source_pull_request."
            }
            $pullJson = gh api "repos/${{ github.repository }}/pulls/$sourcePullRequest"
            if ($LASTEXITCODE -ne 0) { throw "Failed to query source pull request #$sourcePullRequest." }
            $pull = $pullJson | ConvertFrom-Json
            if (-not $pull.merged_at) { throw "Source pull request #$sourcePullRequest is not merged." }
            if ($pull.head.repo.full_name -ne "${{ github.repository }}") {
              throw "Source pull request #$sourcePullRequest is not from the trusted repository."
            }
            if ($pull.base.ref -ne "${{ github.event.repository.default_branch }}") {
              throw "Source pull request #$sourcePullRequest did not target the default branch."
            }
            if ($pull.head.ref -ne "bump-download/$gamever") {
              throw "Source pull request #$sourcePullRequest is not the bump PR for $gamever."
            }
            if ($pull.merge_commit_sha -ne $sourceSha) {
              throw "Source pull request #$sourcePullRequest merge SHA does not match source_sha."
            }
          }
          "gamever=$gamever" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_sha=$sourceSha" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_publish_time=$($preflight.source_publish_time)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publication_mode=$publicationMode" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "binary_lock_sha256=$($preflight.binary_lock_sha256)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
  warmup-idb:
    # The tracked (rebuild-free) path runs no IDA analysis and exports no BinSync
    # candidate, so nothing downstream ever opens an IDB. Binaries are provisioned
    # and lock-verified by the build job's own init_gamebin.py prepare instead.
    needs: preflight
    if: inputs.source_artifact_mode != 'tracked'
    uses: ./.github/workflows/warmup-idb.yml
    with:
      gamever: ${{ needs.preflight.outputs.gamever }}
      source_sha: ${{ needs.preflight.outputs.source_sha }}
    secrets: inherit
  ensure-binsync-remotes:
    # A GAMEVER's canonical BinSync remotes are created out of band and the build
    # job only ever clones them; nothing else provisions a brand-new GAMEVER, so a
    # missing remote surfaces as a 502 from the self-hosted HZVM:8080 read proxy
    # when the build clones it. The tracked path exports no BinSync candidate at
    # all, so it needs no remotes. Provisioning is pinned to the immutable source
    # SHA because a remote's binary_hash must match the lock the build validates.
    needs: preflight
    if: >-
      ${{ github.repository == 'HLND2T/CS2_VibeSignatures'
      && inputs.source_artifact_mode != 'tracked' }}
    runs-on: ubuntu-latest
    environment: binsync-remotes
    steps:
      - name: Checkout immutable source for trusted provisioning
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Create and initialize missing BinSync remotes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HLND2T_GH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "HLND2T_GH_TOKEN is not configured for the binsync-remotes environment."
          }
          $orgLogin = gh api orgs/HLND2T --jq .login
          if ($LASTEXITCODE -ne 0) {
            throw "HLND2T_GH_TOKEN could not authenticate to the HLND2T organization."
          }
          if ($orgLogin.Trim() -ne "HLND2T") {
            throw "HLND2T_GH_TOKEN authenticated to an unexpected organization: '$($orgLogin.Trim())' (expected HLND2T)."
          }
          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw "gh auth setup-git failed." }
          uv run init_gamebin.py ensure-binsync-remotes "${{ needs.preflight.outputs.gamever }}" --user release-automation
          if ($LASTEXITCODE -ne 0) { throw "BinSync remote provisioning failed." }
  build:
    needs: [preflight, warmup-idb, ensure-binsync-remotes]
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success'
      && (needs.warmup-idb.result == 'success' || needs.warmup-idb.result == 'skipped')
      && (needs.ensure-binsync-remotes.result == 'success' || needs.ensure-binsync-remotes.result == 'skipped') }}
    environment: win64
    runs-on: [self-hosted, cross-platform]
    outputs:
      binsync_artifact_name: ${{ steps.binsync-prepare.outputs.artifact_name }}
      binsync_artifact_digest: ${{ steps.upload-binsync-candidate.outputs.artifact-digest }}
      ida_runtime_identity: ${{ steps.resolve-consumer-ida.outputs.ida_runtime_identity }}
      prepared_artifact_id: ${{ steps.upload-release-bundle.outputs.artifact-id }}
      prepared_artifact_digest: ${{ steps.upload-release-bundle.outputs.artifact-digest }}
    env:
      GAMEVER: ${{ needs.preflight.outputs.gamever }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      IDB_CACHE_GENERATION: ${{ needs.warmup-idb.outputs.generation }}
      IDB_CACHE_KEY: ${{ needs.warmup-idb.outputs.cache_key }}
      IDB_CACHE_LEASE_ID: ${{ needs.warmup-idb.outputs.lease_id }}
      IDB_CACHE_LEASE_SHA256: ${{ needs.warmup-idb.outputs.lease_sha256 }}
      SOURCE_BINARY_LOCK_SHA256: ${{ needs.preflight.outputs.binary_lock_sha256 }}
      WARMUP_BINARY_LOCK_SHA256: ${{ needs.warmup-idb.outputs.binary_lock_sha256 }}
      BUILD_ID: ${{ needs.preflight.outputs.source_sha }}
      RELEASE_PUBLISH_TIME: ${{ needs.preflight.outputs.source_publish_time }}
      CS2VIBE_AGENT: ${{ secrets.CS2VIBE_AGENT }}
      CS2VIBE_AGENT_MODEL: ${{ secrets.CS2VIBE_AGENT_MODEL }}
      CS2VIBE_LLM_APIKEY: ${{ secrets.CS2VIBE_LLM_APIKEY }}
      CS2VIBE_LLM_BASEURL: ${{ secrets.CS2VIBE_LLM_BASEURL }}
      CS2VIBE_LLM_EFFORT: ${{ secrets.CS2VIBE_LLM_EFFORT }}
      CS2VIBE_LLM_FAKE_AS: ${{ secrets.CS2VIBE_LLM_FAKE_AS }}
      CS2VIBE_LLM_MODEL: ${{ secrets.CS2VIBE_LLM_MODEL }}
      DEPOTDOWNLOADER_STEAM_USERNAME: ${{ secrets.DEPOTDOWNLOADER_STEAM_USERNAME }}
      DEPOTDOWNLOADER_STEAM_PASSWORD: ${{ secrets.DEPOTDOWNLOADER_STEAM_PASSWORD }}
      CI_CACHE_ROOT: ${{ github.workspace }}/.ci-cache/store
      CI_KIND: release
      PYTHONUTF8: '1'
      SOURCE_ARTIFACT_MODE: ${{ inputs.source_artifact_mode }}
    steps:
      - name: Checkout exact generator source
        id: checkout-source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Set up uv
        # Install uv instead of trusting the uv preinstalled on the self-hosted runner.
        uses: hzqst/setup-uv@ed37cb7af6cd89cb8e2ea2f20674ba1d05dc7b35 # S3 cache backend
        with:
          # enable-cache: auto resolves to false on self-hosted runners, so the uv
          # cache is shared through the existing repository S3 bucket instead.
          enable-cache: true
          cache-s3-bucket: actions-cache-cs2-vibesignatures
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      - name: Checkout cache transport tools from workflow source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .cache-tools
          fetch-depth: 1
          persist-credentials: false
      - name: Sync and update submodules via runner Git cache proxy
        id: sync-submodules
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: sync-submodules
      - name: Prepare clean job-local cache layout
        id: s3-layout
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-prepare
      - name: Restore accepted binaries from S3
        id: s3-accepted
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-layout.outputs.accepted-key }}
          path: ${{ steps.s3-layout.outputs.accepted-path }}
          restore-keys: ${{ steps.s3-layout.outputs.accepted-restore-keys }}
      - name: Restore depot binaries from S3
        id: s3-depot
        if: steps.s3-accepted.outputs.cache-restored != 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-layout.outputs.depot-key }}
          path: ${{ steps.s3-layout.outputs.depot-path }}
          restore-keys: ${{ steps.s3-layout.outputs.depot-restore-keys }}
      - name: Verify restored binary caches against source lock
        env:
          CACHE_ACCEPTED_HIT: ${{ steps.s3-accepted.outputs.cache-restored }}
          CACHE_DEPOT_HIT: ${{ steps.s3-depot.outputs.cache-restored }}
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-verify-restored
      - name: Prepare local accepted binaries
        id: prepare-workspace
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: accepted-restore
      - name: Resolve consumer IDA identity
        id: resolve-consumer-ida
        if: inputs.source_artifact_mode != 'tracked'
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: resolve-consumer-ida
      - name: Resolve exact S3 generation and lease paths
        id: s3-selection
        if: inputs.source_artifact_mode != 'tracked'
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-selection
      - name: Restore exact warm IDB payload from S3
        id: s3-generation
        if: inputs.source_artifact_mode != 'tracked'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-selection.outputs.generation-key }}
          path: ${{ steps.s3-selection.outputs.generation-path }}
          required: 'true'
      - name: Restore current-run IDB lease from S3
        id: s3-lease
        if: inputs.source_artifact_mode != 'tracked'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-selection.outputs.lease-key }}
          path: ${{ steps.s3-selection.outputs.lease-path }}
          required: 'true'
      - name: Restore required published warm IDB cache
        id: restore-idb-cache
        if: inputs.source_artifact_mode != 'tracked'
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: idb-restore
      - name: Resolve immutable analysis config
        id: resolve-config
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: resolve-config
      - name: Check formatting and run repository test suites
        id: test-suites
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: repo-tests
      - name: Initialize binaries without remote BinSync access
        id: init-binaries
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: init-binaries
      - name: Stage verified accepted binaries for S3
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: accepted-stage
      - name: Save verified accepted binaries to S3
        if: steps.s3-accepted.outputs.cache-hit != 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-layout.outputs.accepted-key }}
          path: ${{ steps.s3-layout.outputs.accepted-path }}
      - name: Check configured depot files for publication
        id: s3-depot-ready
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-depot-ready
      - name: Save verified depot binaries to S3
        if: steps.s3-depot.outputs.cache-hit != 'true' && steps.s3-depot-ready.outputs.ready == 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-layout.outputs.depot-key }}
          path: ${{ steps.s3-layout.outputs.depot-path }}
      - name: Prepare fresh checkout-external release artifact rebuild
        id: prepare-artifact-rebuild
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: release-prepare
      - name: Analyze platforms concurrently with force-all and rename
        id: analyze
        if: inputs.source_artifact_mode != 'tracked'
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: release-analyze
      - name: Upload platform analysis logs and execution records
        if: always() && steps.analyze.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: release-platform-analysis-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.GAMEVER }}
          path: |
            ${{ runner.temp }}/release-platform-analysis-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.GAMEVER }}/*.log
            ${{ runner.temp }}/release-platform-analysis-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.GAMEVER }}/summary.json
            ${{ runner.temp }}/release-platform-analysis-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.GAMEVER }}/**/worker.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify fresh artifacts reproduce immutable Git truth
        id: verify-artifact-rebuild
        if: inputs.source_artifact_mode != 'tracked'
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: release-verify
      - name: Upload release rebuild verification failure evidence
        if: ${{ inputs.source_artifact_mode != 'tracked' && failure() && steps.verify-artifact-rebuild.outcome ==
          'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-rebuild-diagnostics-${{ env.GAMEVER }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_REBUILD_DIAGNOSTICS }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
      - name: Bind tracked source-owned artifacts
        id: bind-tracked
        if: inputs.source_artifact_mode == 'tracked'
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: release-bind
      - name: Prepare local-only BinSync candidate without remote writes
        id: binsync-prepare
        if: inputs.source_artifact_mode != 'tracked'
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: release-binsync
      - name: Build immutable symbol and gamedata candidates
        id: build-candidates
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: release-candidates
      - name: Bind source-owned SDK for C++ ABI validation
        id: select-sdk
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: select-sdk
      - name: Prepare source-bound Release assets for hosted ABI validation
        id: build-release-bundle
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: release-bundle-prepare
      - name: Upload credential-free internal BinSync candidate
        id: upload-binsync-candidate
        if: inputs.source_artifact_mode != 'tracked'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.binsync-prepare.outputs.artifact_name }}
          path: ${{ env.BINSYNC_CANDIDATE_ROOT }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true
      - name: Upload prepared Release assets
        id: upload-release-bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-release-bundle.outputs.artifact_name }}
          path: ${{ env.RELEASE_BUNDLE_ROOT }}
          if-no-files-found: error
          # Gamedata generators emit dot-directories (e.g. modsharp-public/.asset);
          # upload-artifact drops hidden files unless this is set.
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
          overwrite: true
      - name: Clean ephemeral candidate state
        id: cleanup
        if: always()
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cleanup
  verify-binsync:
    needs: [preflight, build]
    if: inputs.source_artifact_mode != 'tracked'
    uses: ./.github/workflows/verify-binsync-candidate.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      gamever: ${{ needs.preflight.outputs.gamever }}
      release_version: ${{ needs.preflight.outputs.gamever }}
      build_id: ${{ needs.preflight.outputs.source_sha }}
      ida_runtime_identity: ${{ needs.build.outputs.ida_runtime_identity }}
      artifact_name: ${{ needs.build.outputs.binsync_artifact_name }}
      artifact_digest: ${{ needs.build.outputs.binsync_artifact_digest }}
  verify-release:
    needs: [preflight, build, verify-binsync, finalize-release]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.finalize-release.result == 'success'
      && (needs.verify-binsync.result == 'success' || needs.verify-binsync.result == 'skipped') }}
    uses: ./.github/workflows/verify-release-bundle.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      gamever: ${{ needs.preflight.outputs.gamever }}
      release_version: ${{ needs.preflight.outputs.gamever }}
      build_id: ${{ needs.preflight.outputs.source_sha }}
      artifact_name: ${{ needs.finalize-release.outputs.release_artifact_name }}
      artifact_digest: ${{ needs.finalize-release.outputs.release_artifact_digest }}
      binsync_candidate_digest: ${{ needs.verify-binsync.outputs.publication_digest }}
      binsync_target_state_digest: ${{ needs.verify-binsync.outputs.target_state_digest }}
  check-publication-target:
    needs: [preflight, verify-release]
    if: needs.preflight.outputs.publication_mode != 'verify-only'
    runs-on: ubuntu-latest
    # Draft Releases are only listed for tokens with push access, so target
    # checks that must see a draft (republish resume) need contents: write.
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Check Release target before publishing BinSync
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_MODE: ${{ needs.preflight.outputs.publication_mode }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.gamever }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        shell: bash
        run: >-
          uv run python release_publish.py --check-target-only
          --repository "$GITHUB_REPOSITORY" --release-version "$RELEASE_VERSION"
          --source-sha "$SOURCE_SHA" --publication-mode "$PUBLICATION_MODE"
  publish-binsync:
    needs: [preflight, build, verify-binsync, verify-release, check-publication-target]
    if: needs.preflight.outputs.publication_mode != 'verify-only'
    uses: ./.github/workflows/publish-binsync-candidate.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      gamever: ${{ needs.preflight.outputs.gamever }}
      release_version: ${{ needs.preflight.outputs.gamever }}
      build_id: ${{ needs.preflight.outputs.source_sha }}
      ida_runtime_identity: ${{ needs.build.outputs.ida_runtime_identity }}
      artifact_name: ${{ needs.build.outputs.binsync_artifact_name }}
      artifact_digest: ${{ needs.build.outputs.binsync_artifact_digest }}
    secrets: inherit
  publish-release:
    needs: [preflight, build, verify-binsync, verify-release, publish-binsync, finalize-release]
    # verify-binsync/publish-binsync are skipped whole for a tracked binding, so
    # this gate accepts "skipped" but never "failure" for either of them.
    if: >-
      ${{ !cancelled() && needs.preflight.outputs.publication_mode != 'verify-only'
      && needs.verify-release.result == 'success'
      && (needs.verify-binsync.result == 'success' || needs.verify-binsync.result == 'skipped')
      && (needs.publish-binsync.result == 'success' || needs.publish-binsync.result == 'skipped') }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-release-bundle.yml
    with:
      publication_mode: ${{ needs.preflight.outputs.publication_mode }}
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      gamever: ${{ needs.preflight.outputs.gamever }}
      release_version: ${{ needs.preflight.outputs.gamever }}
      build_id: ${{ needs.preflight.outputs.source_sha }}
      artifact_name: ${{ needs.finalize-release.outputs.release_artifact_name }}
      artifact_digest: ${{ needs.finalize-release.outputs.release_artifact_digest }}
      binsync_candidate_digest: ${{ needs.verify-binsync.outputs.publication_digest }}
      binsync_target_state_digest: ${{ needs.verify-binsync.outputs.target_state_digest }}
      verified_manifest_digest: ${{ needs.verify-release.outputs.manifest_digest }}
      verified_bundle_digest: ${{ needs.verify-release.outputs.bundle_digest }}
      verified_binsync_target_state_digest: ${{ needs.verify-release.outputs.binsync_target_state_digest }}
  verify-only-complete:
    needs: [preflight, build, verify-binsync, verify-release]
    if: >-
      ${{ !cancelled() && needs.preflight.outputs.publication_mode == 'verify-only'
      && needs.verify-release.result == 'success'
      && (needs.verify-binsync.result == 'success' || needs.verify-binsync.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record non-publishing verification result
        shell: bash
        run: |
          {
            echo '## Release verify-only completed'
            echo
            echo '- Source SHA: `${{ needs.preflight.outputs.source_sha }}`'
            echo '- GAMEVER: `${{ needs.preflight.outputs.gamever }}`'
            echo '- Release bundle digest: `${{ needs.verify-release.outputs.bundle_digest }}`'
            echo '- Release manifest digest: `${{ needs.verify-release.outputs.manifest_digest }}`'
            echo '- Source artifact mode: `${{ inputs.source_artifact_mode || 'rebuild' }}`'
            echo '- BinSync candidate digest: `${{ needs.verify-binsync.outputs.publication_digest || 'not exported (rebuild-free)' }}`'
            echo '- No BinSync refs, tags, Releases, or Release assets were published.'
          } >> "$GITHUB_STEP_SUMMARY"
  cpp-validation:
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' }}
    needs:
      - preflight
      - build
    uses: ./.github/workflows/cpp-validation.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      gamever: ${{ needs.preflight.outputs.gamever }}
      artifact_id: ${{ needs.build.outputs.prepared_artifact_id }}
      artifact_digest: ${{ needs.build.outputs.prepared_artifact_digest }}
      scope: release-build
      input_path: cpp-inputs
  finalize-release:
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.cpp-validation.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .cache-tools
          persist-credentials: false
      - name: Bind exact current-run prepared-release
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          CI_ARTIFACT_ID: ${{ needs.build.outputs.prepared_artifact_id }}
          CI_ARTIFACT_DIGEST: ${{ needs.build.outputs.prepared_artifact_digest }}
        run: uv run --project .cache-tools python .cache-tools/ci_runner.py bind-artifact
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.prepared_artifact_id }}
          path: ${{ runner.temp }}/prepared-release
      - name: Bind exact current-run cpp-evidence
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          CI_ARTIFACT_ID: ${{ needs.cpp-validation.outputs.artifact_id }}
          CI_ARTIFACT_DIGEST: ${{ needs.cpp-validation.outputs.artifact_digest }}
        run: uv run --project .cache-tools python .cache-tools/ci_runner.py bind-artifact
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.cpp-validation.outputs.artifact_id }}
          path: ${{ runner.temp }}/cpp-evidence
      - name: Finalize Release with both ABI gates
        id: finalize
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: release-finalize
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ steps.finalize.outputs.artifact_name }}
          path: ${{ env.RELEASE_BUNDLE_ROOT }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
          overwrite: true
    needs:
      - preflight
      - build
      - cpp-validation
    outputs:
      release_artifact_name: ${{ steps.finalize.outputs.artifact_name }}
      release_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      release_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
