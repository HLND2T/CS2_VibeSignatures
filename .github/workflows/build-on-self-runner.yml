name: Build On Self Runner
run-name: Release build ${{ inputs.gamever || github.event.client_payload.gamever }}
on:
  workflow_dispatch:
    inputs:
      gamever:
        description: Game version from download.yaml
        required: true
        type: string
      source_sha:
        description: Full immutable commit SHA reachable from the default branch
        required: true
        type: string
  repository_dispatch:
    types: [build-on-self-runner]
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.gamever || github.event.client_payload.gamever }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'HLND2T/CS2_VibeSignatures'
    runs-on: ubuntu-latest
    outputs:
      gamever: ${{ steps.resolve.outputs.gamever }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_publish_time: ${{ steps.resolve.outputs.source_publish_time }}
    steps:
      - name: Checkout default branch for trust validation
        id: checkout-trust
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        id: setup-uv
      - name: Resolve and validate dispatch contract
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $gamever = "${{ inputs.gamever || github.event.client_payload.gamever }}"
          $sourceSha = "${{ inputs.source_sha || github.event.client_payload.source_sha }}"
          $sourcePullRequest = "${{ github.event.client_payload.source_pull_request }}"
          git fetch origin --tags --force "+refs/heads/*:refs/remotes/origin/*"
          git checkout --detach "$sourceSha"
          if ($LASTEXITCODE -ne 0) { throw "Unable to checkout immutable release source." }
          $preflightJson = uv run python release_source_preflight.py --repo-root "${{ github.workspace }}" `
            --repository "${{ github.repository }}" --gamever "$gamever" `
            --source-sha "$sourceSha" --default-ref "origin/${{ github.event.repository.default_branch }}"
          if ($LASTEXITCODE -ne 0) { throw "Immutable release source preflight failed." }
          $preflight = $preflightJson | ConvertFrom-Json
          if ($preflight.source_sha -ne $sourceSha -or `
              $preflight.source_publish_time -notmatch '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$') {
            throw "Immutable release source preflight output is invalid."
          }
          if ("${{ github.event_name }}" -eq "repository_dispatch") {
            if ($sourcePullRequest -notmatch '^[1-9][0-9]*$') {
              throw "repository_dispatch requires a numeric source_pull_request."
            }
            $pullJson = gh api "repos/${{ github.repository }}/pulls/$sourcePullRequest"
            if ($LASTEXITCODE -ne 0) { throw "Failed to query source pull request #$sourcePullRequest." }
            $pull = $pullJson | ConvertFrom-Json
            if (-not $pull.merged_at) { throw "Source pull request #$sourcePullRequest is not merged." }
            if ($pull.head.repo.full_name -ne "${{ github.repository }}") {
              throw "Source pull request #$sourcePullRequest is not from the trusted repository."
            }
            if ($pull.base.ref -ne "${{ github.event.repository.default_branch }}") {
              throw "Source pull request #$sourcePullRequest did not target the default branch."
            }
            if ($pull.head.ref -ne "bump-download/$gamever") {
              throw "Source pull request #$sourcePullRequest is not the bump PR for $gamever."
            }
            if ($pull.merge_commit_sha -ne $sourceSha) {
              throw "Source pull request #$sourcePullRequest merge SHA does not match source_sha."
            }
          }
          "gamever=$gamever" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_sha=$sourceSha" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_publish_time=$($preflight.source_publish_time)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
  warmup-idb:
    needs: preflight
    uses: ./.github/workflows/warmup-idb.yml
    with:
      gamever: ${{ needs.preflight.outputs.gamever }}
      source_sha: ${{ needs.preflight.outputs.source_sha }}
    secrets: inherit
  build:
    needs: [preflight, warmup-idb]
    environment: win64
    runs-on: [self-hosted, windows, x64]
    outputs:
      binsync_artifact_name: ${{ steps.binsync-prepare.outputs.artifact_name }}
      binsync_artifact_digest: ${{ steps.upload-binsync-candidate.outputs.artifact-digest }}
      ida_runtime_identity: ${{ steps.resolve-consumer-ida.outputs.ida_runtime_identity }}
      release_artifact_name: ${{ steps.build-release-bundle.outputs.artifact_name }}
      release_artifact_digest: ${{ steps.upload-release-bundle.outputs.artifact-digest }}
    env:
      GAMEVER: ${{ needs.preflight.outputs.gamever }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      IDB_CACHE_GENERATION: ${{ needs.warmup-idb.outputs.generation }}
      IDB_CACHE_KEY: ${{ needs.warmup-idb.outputs.cache_key }}
      BUILD_ID: ${{ needs.preflight.outputs.source_sha }}
      RELEASE_PUBLISH_TIME: ${{ needs.preflight.outputs.source_publish_time }}
      CS2VIBE_AGENT: ${{ secrets.CS2VIBE_AGENT }}
      CS2VIBE_AGENT_MODEL: ${{ secrets.CS2VIBE_AGENT_MODEL }}
      CS2VIBE_LLM_APIKEY: ${{ secrets.CS2VIBE_LLM_APIKEY }}
      CS2VIBE_LLM_BASEURL: ${{ secrets.CS2VIBE_LLM_BASEURL }}
      CS2VIBE_LLM_EFFORT: ${{ secrets.CS2VIBE_LLM_EFFORT }}
      CS2VIBE_LLM_FAKE_AS: ${{ secrets.CS2VIBE_LLM_FAKE_AS }}
      CS2VIBE_LLM_MODEL: ${{ secrets.CS2VIBE_LLM_MODEL }}
      DEPOTDOWNLOADER_STEAM_USERNAME: ${{ secrets.DEPOTDOWNLOADER_STEAM_USERNAME }}
      DEPOTDOWNLOADER_STEAM_PASSWORD: ${{ secrets.DEPOTDOWNLOADER_STEAM_PASSWORD }}
      PERSISTED_WORKSPACE: ${{ secrets.PERSISTED_WORKSPACE }}
      SUBMODULE_CACHE_VERSION: v1
    steps:
      - name: Checkout exact generator source
        id: checkout-source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Compute submodule cache key
        id: submodule-cache-key
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $content = @()
          $content += Get-Content -Raw .gitmodules
          $content += ""
          # The submodule state prefix (- for uninitialized, ' ' for initialized)
          # differs by working-tree state, so a key derived from that output drifts
          # between the miss and save phases and the cache never hits. Read the
          # committed gitlink SHAs from HEAD instead; they are deterministic.
          $content += git ls-tree HEAD
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $bytes = [System.Text.Encoding]::UTF8.GetBytes(($content -join "`n"))
          $hash = [System.BitConverter]::ToString($sha.ComputeHash($bytes)).Replace("-", "").ToLowerInvariant()
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore submodule cache
        id: restore-submodule-cache
        uses: actions/cache@v5
        with:
          path: |
            .git/modules
            hl2sdk_cs2
          key: ${{ runner.os }}-submodules-${{ env.SUBMODULE_CACHE_VERSION }}-${{ steps.submodule-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-submodules-${{ env.SUBMODULE_CACHE_VERSION }}-
      - name: Sync and update submodules
        id: sync-submodules
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw "git submodule sync failed." }
          git submodule update --init --recursive --depth 1 --jobs 8
          if ($LASTEXITCODE -ne 0) { throw "git submodule update failed." }
      - name: Prepare persisted depot link and real bin copy
        id: prepare-workspace
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PERSISTED_WORKSPACE)) { throw "PERSISTED_WORKSPACE is not configured." }
          $workspace = [IO.Path]::GetFullPath("${{ github.workspace }}")
          # Isolate the depot per GAMEVER so concurrent runs never share a download tree.
          $depotTarget = [IO.Path]::GetFullPath((Join-Path $env:PERSISTED_WORKSPACE "cs2_depot\$env:GAMEVER"))
          $depotLink = Join-Path $workspace "cs2_depot"
          [System.IO.Directory]::CreateDirectory($depotTarget) | Out-Null
          if (Test-Path -LiteralPath $depotLink) {
            $item = Get-Item -LiteralPath $depotLink -Force
            if (-not ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw "cs2_depot must be a link." }
          } else {
            cmd /c mklink /d "$depotLink" "$depotTarget"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create cs2_depot link." }
          }
          $workspaceBin = Join-Path $workspace "bin"
          New-Item -ItemType Directory -Path $workspaceBin -Force | Out-Null
          if ((Get-Item $workspaceBin -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) {
            throw "Workspace bin must be a real directory"
          }
          uv run python accepted_bin.py restore --repo-root "$workspace" `
            --persisted-root "$env:PERSISTED_WORKSPACE" --gamever "$env:GAMEVER"
          if ($LASTEXITCODE -ne 0) { throw "Failed to restore the exact accepted binary allowlist." }
      - name: Resolve consumer IDA identity
        id: resolve-consumer-ida
        shell: pwsh
        run: |
          $pythonExe = (Get-Command python -ErrorAction SilentlyContinue).Source
          $idalibMcpExe = (Get-Command idalib-mcp -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($pythonExe) -or [string]::IsNullOrWhiteSpace($idalibMcpExe)) {
            throw "python with idalib and idalib-mcp must both be available on PATH."
          }
          $pythonExe = [IO.Path]::GetFullPath($pythonExe)
          $idalibMcpExe = [IO.Path]::GetFullPath($idalibMcpExe)
          $pythonDir = Split-Path -Parent $pythonExe
          $mcpDir = Split-Path -Parent $idalibMcpExe
          $pythonScriptsDir = Join-Path $pythonDir "Scripts"
          if (-not [StringComparer]::OrdinalIgnoreCase.Equals($mcpDir, $pythonDir) -and `
              -not [StringComparer]::OrdinalIgnoreCase.Equals($mcpDir, $pythonScriptsDir)) {
            throw "python and idalib-mcp resolve to different installations: python=$pythonExe idalib-mcp=$idalibMcpExe"
          }
          $idaVersion = (& $pythonExe warmup_idb_worker.py --print-ida-version).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($idaVersion)) {
            throw "Failed to resolve the consumer IDA kernel version."
          }
          "IDA_VERSION=$idaVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "IDA_PYTHON=$pythonExe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ida_runtime_identity=$idaVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore required published warm IDB cache
        id: restore-idb-cache
        shell: pwsh
        run: |
          uv run python idb_cache.py restore `
            --repo-root "${{ github.workspace }}" `
            --persisted-root "$env:PERSISTED_WORKSPACE" `
            --gamever "$env:GAMEVER" `
            --generation "$env:IDB_CACHE_GENERATION" `
            --cache-key "$env:IDB_CACHE_KEY" `
            --ida-version "$env:IDA_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Required published IDB cache restore failed." }
      - name: Resolve immutable analysis config
        id: resolve-config
        shell: pwsh
        run: |
          $config = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "configs\$env:GAMEVER.yaml"))
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
            throw "Missing analysis config for GAMEVER $env:GAMEVER`: $config"
          }
          $hash = (Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash.ToLowerInvariant()
          "ANALYSIS_CONFIG=$config" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANALYSIS_CONFIG_SHA256=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Analysis config: $config"
          Write-Host "Analysis config SHA-256: $hash"
      - name: Check formatting and run repository test suites
        id: test-suites
        shell: pwsh
        run: |
          uv run python format_repo_files.py --check
          if ($LASTEXITCODE -ne 0) { throw "Repository formatting check failed." }
          foreach ($suite in @('unit', 'repository-contract', 'redis-integration', 'release-integration', 'all')) {
            uv run python tests/run_test_suite.py $suite -b --durations 30
            if ($LASTEXITCODE -ne 0) { throw "Repository test suite failed: $suite" }
          }
      - name: Initialize binaries without remote BinSync access
        id: init-binaries
        shell: pwsh
        run: |
          uv run init_gamebin.py prepare "$env:GAMEVER" --binsync skip
          if ($LASTEXITCODE -ne 0) { throw "init_gamebin.py prepare failed with exit code $LASTEXITCODE" }
      - name: Prepare fresh checkout-external release artifact rebuild
        id: prepare-artifact-rebuild
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "release-artifact-rebuild\$env:BUILD_ID"
          uv run python release_artifact_rebuild.py prepare `
            --repo-root "${{ github.workspace }}" --source-sha "$env:SOURCE_SHA" `
            --gamever "$env:GAMEVER" --binary-root bin --staging-root "$staging"
          if ($LASTEXITCODE -ne 0) { throw "Release artifact rebuild preflight failed." }
          $preparation = Join-Path $staging "release-rebuild-preparation.json"
          $verification = Join-Path $staging "release-rebuild-verification.json"
          $document = Get-Content -LiteralPath $preparation -Raw | ConvertFrom-Json
          "RELEASE_REBUILD_PREPARATION=$preparation" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_REBUILD_VERIFICATION=$verification" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ACTUAL_ARTIFACT_ROOT=$($document.actual_artifact_root)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "FORCE_ALL_EXECUTION_REPORT=$($document.execution_report)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Analyze every producer group with force-all and rename
        id: analyze
        shell: pwsh
        run: |
          $args = @(
            '-gamever', $env:GAMEVER,
            '-configyaml', $env:ANALYSIS_CONFIG,
            '-bindir', 'bin',
            '-artifactdir', $env:ACTUAL_ARTIFACT_ROOT,
            '-oldartifactdir', 'bin_artifacts',
            '-execution_report', $env:FORCE_ALL_EXECUTION_REPORT,
            '-require_warm_idb', '-force_all', '-rename', '-debug'
          )
          uv run ida_analyze_bin.py @args
          if ($LASTEXITCODE -ne 0) { throw "ida_analyze_bin.py failed with exit code $LASTEXITCODE" }
      - name: Verify fresh artifacts exactly reproduce immutable Git truth
        id: verify-artifact-rebuild
        shell: pwsh
        run: |
          uv run python release_artifact_rebuild.py verify `
            --repo-root "${{ github.workspace }}" `
            --preparation "$env:RELEASE_REBUILD_PREPARATION" `
            --output "$env:RELEASE_REBUILD_VERIFICATION"
          if ($LASTEXITCODE -ne 0) { throw "Fresh release artifacts differ from Git truth." }
      - name: Prepare local-only BinSync candidate without remote writes
        id: binsync-prepare
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP "release-binsync-candidate\$env:BUILD_ID"
          $artifactName = "binsync-candidate-$env:SOURCE_SHA-$env:GAMEVER"
          uv run python push_binsync_symbols.py "$env:GAMEVER" `
            --prepare-only `
            --candidate-dir "$candidate" `
            --artifactdir "$env:ACTUAL_ARTIFACT_ROOT" `
            --preparation "$env:RELEASE_REBUILD_PREPARATION" `
            --release-version "$env:GAMEVER" `
            --build-id "$env:BUILD_ID" `
            --ida-runtime-identity "$env:IDA_VERSION" `
            --actions-artifact-name "$artifactName" `
            --binsync-user release-automation `
            --python "$env:IDA_PYTHON"
          if ($LASTEXITCODE -ne 0) { throw "Local-only BinSync candidate preparation failed." }
          "BINSYNC_CANDIDATE_ROOT=$candidate" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "artifact_name=$artifactName" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build immutable symbol and gamedata candidates
        id: build-candidates
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "release-candidates\$env:BUILD_ID"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $candidate = Join-Path $root "$env:GAMEVER.yaml"
          $session = Join-Path $root "$env:GAMEVER.session.json"
          $gamedataRoot = Join-Path $root "gamedata-candidate"
          $gamedataSession = Join-Path $root "$env:GAMEVER.gamedata.session.json"
          $metadata = Join-Path $root "$env:GAMEVER.metadata.yaml"
          $cppLog = Join-Path $root "$env:GAMEVER.cpp-validation.log"
          "CANDIDATE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ACTUAL_CANDIDATE_SNAPSHOT=$candidate" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_SESSION=$session" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GAMEDATA_CANDIDATE_ROOT=$gamedataRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GAMEDATA_SESSION=$gamedataSession" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_METADATA=$metadata" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CPP_VALIDATION_LOG=$cppLog" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          uv run gamesymbol_candidate.py build -gamever "$env:GAMEVER" -bindir bin `
            -artifactdir "$env:ACTUAL_ARTIFACT_ROOT" -configyaml "$env:ANALYSIS_CONFIG" `
            -output "$candidate" -session "$session" -last-publish-time "$env:RELEASE_PUBLISH_TIME"
          if ($LASTEXITCODE -ne 0) { throw "candidate build failed with exit code $LASTEXITCODE" }
          uv run gamesymbol_candidate.py guard -candidate "$candidate" -session "$session"
          if ($LASTEXITCODE -ne 0) { throw "candidate guard failed before gamedata" }
          uv run gamedata_candidate.py build -gamever "$env:GAMEVER" -build-id "$env:BUILD_ID" `
            -snapshot "$candidate" -configyaml "$env:ANALYSIS_CONFIG" `
            -candidate-root "$gamedataRoot" -session "$gamedataSession" -debug
          if ($LASTEXITCODE -ne 0) { throw "gamedata candidate build failed with exit code $LASTEXITCODE" }
          uv run gamedata_candidate.py guard -session "$gamedataSession"
          if ($LASTEXITCODE -ne 0) { throw "gamedata candidate guard failed" }
          uv run gamesymbol_metadata.py generate -gamever "$env:GAMEVER" `
            -configyaml "$env:ANALYSIS_CONFIG" -output "$metadata"
          if ($LASTEXITCODE -ne 0) { throw "metadata candidate generation failed" }
          uv run gamesymbol_candidate.py guard -candidate "$candidate" -session "$session"
          if ($LASTEXITCODE -ne 0) { throw "candidate guard failed after gamedata" }
          uv run gamesymbol_candidate.py mark -candidate "$candidate" -session "$session" -step gamedata
          if ($LASTEXITCODE -ne 0) { throw "failed to mark gamedata validation" }
      - name: Select versioned SDK for C++ ABI validation
        id: select-sdk
        shell: pwsh
        run: |
          $sdkPath = Join-Path $env:GITHUB_WORKSPACE "hl2sdk_cs2"
          $safeSdkPath = ([IO.Path]::GetFullPath($sdkPath) -replace '\\', '/')
          git config --global --add safe.directory "$safeSdkPath"
          if ($LASTEXITCODE -ne 0) { throw "Failed to trust hl2sdk_cs2 Git directory." }
          $sdkRef = "cs2-$env:GAMEVER"
          $sdkRemote = "https://github.com/HLND2T/hl2sdk.git"
          $pinnedSha = (git -C $sdkPath rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $pinnedSha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Unable to resolve the pinned hl2sdk_cs2 commit."
          }
          "SDK_PINNED_SHA=$pinnedSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $remoteBranch = git -C $sdkPath ls-remote --heads $sdkRemote "refs/heads/$sdkRef"
          if ($LASTEXITCODE -ne 0) { throw "Unable to query $sdkRef from hl2sdk." }
          if ([string]::IsNullOrWhiteSpace($remoteBranch)) {
            "SDK_ABI_REF=pinned-submodule" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            "SDK_ABI_SHA=$pinnedSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            "SDK_ABI_SWITCHED=false" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "No versioned SDK branch exists for $sdkRef; retaining the pinned submodule revision."
            Write-Host "C++ ABI SDK selection: GAMEVER=$env:GAMEVER; ref=pinned-submodule; selected SHA=$pinnedSha; pinned SHA=$pinnedSha"
          } else {
            $remoteSha = ($remoteBranch -split '\s+')[0]
            if ($remoteSha -notmatch '^[0-9a-fA-F]{40}$') { throw "Invalid commit returned for $sdkRef." }
            git -C $sdkPath fetch --no-tags --depth 1 $sdkRemote "refs/heads/$sdkRef"
            if ($LASTEXITCODE -ne 0) { throw "Unable to fetch $sdkRef from hl2sdk." }
            $fetchedSha = (git -C $sdkPath rev-parse FETCH_HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $fetchedSha -ne $remoteSha) {
              throw "Fetched commit for $sdkRef does not match the queried remote commit."
            }
            "SDK_ABI_SWITCHED=true" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            git -C $sdkPath checkout --detach $remoteSha
            if ($LASTEXITCODE -ne 0) { throw "Unable to checkout $sdkRef." }
            $selectedSha = (git -C $sdkPath rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $selectedSha -ne $remoteSha) {
              throw "Selected SDK commit does not match $sdkRef."
            }
            "SDK_ABI_REF=$sdkRef" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            "SDK_ABI_SHA=$selectedSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "C++ ABI SDK selection: GAMEVER=$env:GAMEVER; ref=$sdkRef; selected SHA=$selectedSha; pinned SHA=$pinnedSha"
          }
      - name: Run C++ tests
        id: cpp-tests
        shell: pwsh
        run: |
          uv run gamesymbol_candidate.py guard -candidate "$env:ACTUAL_CANDIDATE_SNAPSHOT" -session "$env:CANDIDATE_SESSION"
          if ($LASTEXITCODE -ne 0) { throw "candidate guard failed before C++ tests" }
          & uv run run_cpp_tests.py -gamever "$env:GAMEVER" `
            -snapshot "$env:ACTUAL_CANDIDATE_SNAPSHOT" `
            -configyaml "$env:ANALYSIS_CONFIG" -debug 2>&1 | Tee-Object -LiteralPath "$env:CPP_VALIDATION_LOG"
          if ($LASTEXITCODE -ne 0) { throw "run_cpp_tests.py failed with exit code $LASTEXITCODE" }
          uv run gamesymbol_candidate.py guard -candidate "$env:ACTUAL_CANDIDATE_SNAPSHOT" -session "$env:CANDIDATE_SESSION"
          if ($LASTEXITCODE -ne 0) { throw "candidate guard failed after C++ tests" }
          uv run gamesymbol_candidate.py mark -candidate "$env:ACTUAL_CANDIDATE_SNAPSHOT" -session "$env:CANDIDATE_SESSION" -step cpp_tests
          if ($LASTEXITCODE -ne 0) { throw "failed to mark C++ validation" }
      - name: Restore pinned SDK revision
        id: restore-sdk
        if: always()
        shell: pwsh
        run: |
          if ($env:SDK_ABI_SWITCHED -ne "true") {
            Write-Host "C++ ABI SDK restore: pinned submodule revision remained selected."
            exit 0
          }
          if ($env:SDK_PINNED_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "SDK_PINNED_SHA is unavailable or invalid."
          }
          $sdkPath = Join-Path $env:GITHUB_WORKSPACE "hl2sdk_cs2"
          git -C $sdkPath checkout --detach "$env:SDK_PINNED_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Unable to restore pinned hl2sdk_cs2 commit." }
          $restoredSha = (git -C $sdkPath rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $restoredSha -ne $env:SDK_PINNED_SHA) {
            throw "Restored SDK commit does not match SDK_PINNED_SHA."
          }
          Write-Host "C++ ABI SDK restore: restored pinned SHA=$restoredSha"
      - name: Build immutable Release bundle and source-bound manifest
        id: build-release-bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "release-bundle\$env:BUILD_ID"
          $artifactName = "release-bundle-$env:SOURCE_SHA-$env:GAMEVER"
          uv run python release_bundle.py build `
            --repo-root "${{ github.workspace }}" `
            --bundle-root "$bundle" `
            --repository "${{ github.repository }}" `
            --release-version "$env:GAMEVER" `
            --build-id "$env:BUILD_ID" `
            --preparation "$env:RELEASE_REBUILD_PREPARATION" `
            --rebuild-verification "$env:RELEASE_REBUILD_VERIFICATION" `
            --snapshot "$env:ACTUAL_CANDIDATE_SNAPSHOT" `
            --metadata "$env:CANDIDATE_METADATA" `
            --gamedata-candidate-root "$env:GAMEDATA_CANDIDATE_ROOT" `
            --gamedata-session "$env:GAMEDATA_SESSION" `
            --cpp-validation-log "$env:CPP_VALIDATION_LOG" `
            --binsync-candidate-root "$env:BINSYNC_CANDIDATE_ROOT" `
            --ida-runtime-identity "$env:IDA_VERSION" `
            --warm-idb-generation "$env:IDB_CACHE_GENERATION" `
            --warm-idb-cache-key "$env:IDB_CACHE_KEY" `
            --actions-artifact-name "$artifactName" `
            --cpp-sdk-ref "$env:SDK_ABI_REF" `
            --cpp-sdk-sha "$env:SDK_ABI_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Immutable Release bundle construction failed." }
          "RELEASE_BUNDLE_ROOT=$bundle" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "artifact_name=$artifactName" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload credential-free internal BinSync candidate
        id: upload-binsync-candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.binsync-prepare.outputs.artifact_name }}
          path: ${{ env.BINSYNC_CANDIDATE_ROOT }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true
      - name: Upload immutable Release bundle candidate
        id: upload-release-bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-release-bundle.outputs.artifact_name }}
          path: ${{ env.RELEASE_BUNDLE_ROOT }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true
      - name: Clean ephemeral candidate state
        id: cleanup
        if: always()
        shell: pwsh
        run: |-
          if ($env:CANDIDATE_ROOT -and (Test-Path -LiteralPath $env:CANDIDATE_ROOT)) {
            Remove-Item -LiteralPath $env:CANDIDATE_ROOT -Recurse -Force
          }
          if ($env:BINSYNC_CANDIDATE_ROOT -and (Test-Path -LiteralPath $env:BINSYNC_CANDIDATE_ROOT)) {
            Remove-Item -LiteralPath $env:BINSYNC_CANDIDATE_ROOT -Recurse -Force
          }
          if ($env:RELEASE_BUNDLE_ROOT -and (Test-Path -LiteralPath $env:RELEASE_BUNDLE_ROOT)) {
            Remove-Item -LiteralPath $env:RELEASE_BUNDLE_ROOT -Recurse -Force
          }
  verify-binsync:
    needs: [preflight, build]
    uses: ./.github/workflows/verify-binsync-candidate.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      gamever: ${{ needs.preflight.outputs.gamever }}
      release_version: ${{ needs.preflight.outputs.gamever }}
      build_id: ${{ needs.preflight.outputs.source_sha }}
      ida_runtime_identity: ${{ needs.build.outputs.ida_runtime_identity }}
      artifact_name: ${{ needs.build.outputs.binsync_artifact_name }}
      artifact_digest: ${{ needs.build.outputs.binsync_artifact_digest }}
  verify-release:
    needs: [preflight, build, verify-binsync]
    uses: ./.github/workflows/verify-release-bundle.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      gamever: ${{ needs.preflight.outputs.gamever }}
      release_version: ${{ needs.preflight.outputs.gamever }}
      build_id: ${{ needs.preflight.outputs.source_sha }}
      artifact_name: ${{ needs.build.outputs.release_artifact_name }}
      artifact_digest: ${{ needs.build.outputs.release_artifact_digest }}
      binsync_candidate_digest: ${{ needs.verify-binsync.outputs.publication_digest }}
      binsync_target_state_digest: ${{ needs.verify-binsync.outputs.target_state_digest }}
  publish-binsync:
    needs: [preflight, build, verify-binsync, verify-release]
    uses: ./.github/workflows/publish-binsync-candidate.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      gamever: ${{ needs.preflight.outputs.gamever }}
      release_version: ${{ needs.preflight.outputs.gamever }}
      build_id: ${{ needs.preflight.outputs.source_sha }}
      ida_runtime_identity: ${{ needs.build.outputs.ida_runtime_identity }}
      artifact_name: ${{ needs.build.outputs.binsync_artifact_name }}
      artifact_digest: ${{ needs.build.outputs.binsync_artifact_digest }}
  publish-release:
    needs: [preflight, build, verify-binsync, verify-release, publish-binsync]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-release-bundle.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      gamever: ${{ needs.preflight.outputs.gamever }}
      release_version: ${{ needs.preflight.outputs.gamever }}
      build_id: ${{ needs.preflight.outputs.source_sha }}
      artifact_name: ${{ needs.build.outputs.release_artifact_name }}
      artifact_digest: ${{ needs.build.outputs.release_artifact_digest }}
      binsync_candidate_digest: ${{ needs.verify-binsync.outputs.publication_digest }}
      binsync_target_state_digest: ${{ needs.verify-binsync.outputs.target_state_digest }}
      verified_manifest_digest: ${{ needs.verify-release.outputs.manifest_digest }}
      verified_bundle_digest: ${{ needs.verify-release.outputs.bundle_digest }}
      verified_binsync_target_state_digest: ${{ needs.verify-release.outputs.binsync_target_state_digest }}
