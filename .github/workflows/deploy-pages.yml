name: Deploy Pages
on:
  repository_dispatch:
    types: [pages-release-published]
  workflow_dispatch:
    inputs:
      release_id:
        description: Published immutable GitHub Release ID
        required: true
        type: string
      release_tag:
        description: Published GAMEVER tag
        required: true
        type: string
      source_sha:
        description: Direct immutable source commit
        required: true
        type: string
      manifest_sha256:
        description: Verified Release manifest SHA-256
        required: true
        type: string
permissions: {}
concurrency:
  group: deploy-pages
  cancel-in-progress: true
jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.identity.outputs.release_id }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      manifest_sha256: ${{ steps.identity.outputs.manifest_sha256 }}
    steps:
      - name: Resolve immutable published Release identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RELEASE_ID: ${{ github.event.client_payload.release_id }}
          DISPATCH_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          DISPATCH_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          DISPATCH_MANIFEST_SHA256: ${{ github.event.client_payload.manifest_sha256 }}
          MANUAL_RELEASE_ID: ${{ inputs.release_id }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
          MANUAL_SOURCE_SHA: ${{ inputs.source_sha }}
          MANUAL_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        shell: pwsh
        run: |-
          if ("${{ github.repository }}" -cne 'HLND2T/CS2_VibeSignatures') {
            throw "Pages Release deployment repository is not allowlisted."
          }
          if ($env:EVENT_NAME -eq 'repository_dispatch') {
            $releaseId = $env:DISPATCH_RELEASE_ID
            $releaseTag = $env:DISPATCH_RELEASE_TAG
            $sourceSha = $env:DISPATCH_SOURCE_SHA
            $manifestDigest = $env:DISPATCH_MANIFEST_SHA256
          } else {
            $releaseId = $env:MANUAL_RELEASE_ID
            $releaseTag = $env:MANUAL_RELEASE_TAG
            $sourceSha = $env:MANUAL_SOURCE_SHA
            $manifestDigest = $env:MANUAL_MANIFEST_SHA256
          }
          $sourceSha = $sourceSha.ToLowerInvariant()
          $manifestDigest = $manifestDigest.ToLowerInvariant() -replace '^sha256:', ''
          if ($releaseId -notmatch '^[1-9][0-9]*$') { throw "Pages Release ID is invalid." }
          if ($releaseTag -notmatch '^[0-9]{4,10}[a-z]?$') { throw "Pages Release tag is invalid." }
          if ($sourceSha -notmatch '^[0-9a-f]{40}$') { throw "Pages source SHA is invalid." }
          if ($manifestDigest -notmatch '^[0-9a-f]{64}$') { throw "Pages manifest SHA-256 is invalid." }
          "release_id=$releaseId" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_sha=$sourceSha" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest_sha256=$manifestDigest" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
  build:
    needs: resolve-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pages/package-lock.json
      - name: Install Pages dependencies
        run: npm ci
      - name: Hydrate verified published Release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |-
          $inputRoot = Join-Path $env:RUNNER_TEMP 'pages-release-input'
          $receipt = Join-Path $env:RUNNER_TEMP 'pages-release-input-receipt.json'
          uv run --project .. python ../pages_release_input.py `
            --repository "${{ github.repository }}" `
            --release-id "${{ needs.resolve-release.outputs.release_id }}" `
            --release-tag "${{ needs.resolve-release.outputs.release_tag }}" `
            --source-sha "${{ needs.resolve-release.outputs.source_sha }}" `
            --manifest-sha256 "${{ needs.resolve-release.outputs.manifest_sha256 }}" `
            --output-root "$inputRoot" `
            --receipt "$receipt"
          if ($LASTEXITCODE -ne 0) { throw "Published Release hydration failed." }
          "PAGES_RELEASE_INPUT_ROOT=$inputRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test Pages application
        run: npm test
      - name: Lint Pages application
        run: npm run lint
      - name: Build Pages artifact
        run: npm run build
      - name: Verify current game-symbol bytes
        run: npm run verify:gamesymbols
      - name: Verify current gamedata bytes
        run: npm run verify:gamedata
      - name: Upload current Pages build
        uses: actions/upload-artifact@v5
        with:
          name: pages-current-build
          path: pages/dist
          retention-days: 1
      - name: Upload verified Release input receipt
        uses: actions/upload-artifact@v5
        with:
          name: pages-release-input-verification
          path: ${{ runner.temp }}/pages-release-input-receipt.json
          if-no-files-found: error
          retention-days: 1
  archive:
    needs: [resolve-release, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download current Pages build
        uses: actions/download-artifact@v5
        with:
          name: pages-current-build
          path: pages/dist
      - name: Download verified Release input receipt
        uses: actions/download-artifact@v5
        with:
          name: pages-release-input-verification
          path: ${{ runner.temp }}/pages-verification
      - name: Write final game-symbol verification manifest
        shell: bash
        run: |
          set -euo pipefail
          verification_root="$RUNNER_TEMP/pages-verification"
          mkdir -p "$verification_root"
          node verifyGameSymbolAssets.mjs \
            --directory dist/gamesymbols \
            --write-manifest "$verification_root/manifest.json"
          cp verifyGameSymbolAssets.mjs "$verification_root/verifyGameSymbolAssets.mjs"
      - name: Write final gamedata verification manifest
        shell: bash
        run: |
          set -euo pipefail
          verification_root="$RUNNER_TEMP/pages-verification"
          node verifyGameDataAssets.mjs \
            --directory dist/gamedata \
            --write-manifest "$verification_root/gamedata-manifest.json"
          cp verifyGameDataAssets.mjs "$verification_root/verifyGameDataAssets.mjs"
      - name: Upload static asset verification manifests
        uses: actions/upload-artifact@v5
        with:
          name: pages-static-asset-verification
          path: ${{ runner.temp }}/pages-verification
          retention-days: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/dist
  deploy:
    needs: archive
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download static asset verification manifests
        uses: actions/download-artifact@v5
        with:
          name: pages-static-asset-verification
          path: ${{ runner.temp }}/pages-verification
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify deployed CDN game-symbol bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: >-
          node "$RUNNER_TEMP/pages-verification/verifyGameSymbolAssets.mjs"
          --base-url "${PAGE_URL%/}/gamesymbols/"
          --manifest "$RUNNER_TEMP/pages-verification/manifest.json"
      - name: Verify deployed CDN gamedata bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: >-
          node "$RUNNER_TEMP/pages-verification/verifyGameDataAssets.mjs"
          --base-url "${PAGE_URL%/}/gamedata/"
          --manifest "$RUNNER_TEMP/pages-verification/gamedata-manifest.json"
