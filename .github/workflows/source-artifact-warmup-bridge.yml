name: Source Artifact Bridge Warm IDB Cache
on:
  workflow_call:
    inputs:
      gamever:
        description: Exact GAMEVER from download.yaml
        required: true
        type: string
      source_sha:
        description: Exact source commit containing the analysis config
        required: true
        type: string
      base_sha:
        description: Exact trusted default-branch bridge commit
        required: true
        type: string
    outputs:
      generation:
        description: Immutable published IDB cache generation
        value: ${{ jobs.warmup.outputs.generation }}
      cache_key:
        description: Content-derived IDB cache identity
        value: ${{ jobs.warmup.outputs.cache_key }}
      lease_id:
        description: Persistent protection for this exact generation
        value: ${{ jobs.warmup.outputs.lease_id }}
      lease_sha256:
        description: Digest binding the lease owner and exact selection
        value: ${{ jobs.warmup.outputs.lease_sha256 }}
      binary_lock_sha256:
        description: Canonical source-owned binary lock digest
        value: ${{ jobs.warmup.outputs.binary_lock_sha256 }}
permissions:
  contents: read
jobs:
  warmup:
    if: github.repository == 'HLND2T/CS2_VibeSignatures'
    environment: win64
    runs-on: [self-hosted, windows, x64]
    concurrency:
      group: warmup-idb-${{ github.repository }}-${{ inputs.gamever }}
      cancel-in-progress: false
    outputs:
      generation: ${{ steps.resolve-output.outputs.generation }}
      cache_key: ${{ steps.resolve-output.outputs.cache-key }}
      lease_id: ${{ steps.resolve-output.outputs.lease-id }}
      lease_sha256: ${{ steps.resolve-output.outputs.lease-sha256 }}
      binary_lock_sha256: ${{ steps.sync-accepted-bin.outputs.binary-lock-sha256 }}
    env:
      GAMEVER: ${{ inputs.gamever }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      CI_CACHE_ROOT: ${{ github.workspace }}/.ci-cache/store
      DEPOTDOWNLOADER_STEAM_USERNAME: ${{ secrets.DEPOTDOWNLOADER_STEAM_USERNAME }}
      DEPOTDOWNLOADER_STEAM_PASSWORD: ${{ secrets.DEPOTDOWNLOADER_STEAM_PASSWORD }}
      IDB_WARMUP_MAX_CONCURRENCY: ${{ vars.IDB_WARMUP_MAX_CONCURRENCY }}
      IDB_WARMUP_MAX_MEMORY_MIB: ${{ vars.IDB_WARMUP_MAX_MEMORY_MIB }}
    steps:
      - name: Validate immutable source input
        id: validate-source
        shell: pwsh
        run: |
          if ($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "source_sha must be a full commit SHA."
          }
          if ($env:BASE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "base_sha must be a full commit SHA."
          }
      - name: Checkout exact cache producer source
        id: checkout-source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Verify immutable source checkout
        id: verify-source
        shell: pwsh
        run: |
          $expectedSourceSha = $env:SOURCE_SHA.ToLowerInvariant()
          $actualSourceSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actualSourceSha -ne $expectedSourceSha) {
            throw "Warmup source checkout drifted: expected=$expectedSourceSha actual=$actualSourceSha"
          }
      - name: Set up uv
        id: setup-uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Checkout trusted binary cache tools
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          path: .trusted-tools
      - name: Sync trusted binary cache environment
        shell: pwsh
        run: uv sync --project .trusted-tools --locked
      - name: Checkout cache transport tools from workflow source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .cache-tools
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare clean job-local cache layout
        id: s3-layout
        shell: pwsh
        run: |
          uv run --project .cache-tools python .cache-tools/ci_s3_cache.py prepare
          if ($LASTEXITCODE -ne 0) { throw 'Unable to prepare S3 cache layout.' }
      - name: Restore accepted binaries from S3
        id: s3-accepted
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-layout.outputs.accepted-key }}
          path: ${{ steps.s3-layout.outputs.accepted-path }}
      - name: Restore depot binaries from S3
        id: s3-depot
        if: steps.s3-accepted.outputs.cache-hit != 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-layout.outputs.depot-key }}
          path: ${{ steps.s3-layout.outputs.depot-path }}
      - name: Verify restored binary caches against source lock
        shell: pwsh
        env:
          CACHE_ACCEPTED_HIT: ${{ steps.s3-accepted.outputs.cache-hit }}
          CACHE_DEPOT_HIT: ${{ steps.s3-depot.outputs.cache-hit }}
        run: |
          uv run --project .cache-tools python .cache-tools/ci_s3_cache.py verify-restored
          if ($LASTEXITCODE -ne 0) { throw 'Restored S3 binary cache failed verification.' }
      - name: Restore local accepted binaries
        id: prepare-workspace
        shell: pwsh
        run: |
          $workspace = [IO.Path]::GetFullPath("${{ github.workspace }}")
          $workspaceBin = Join-Path $workspace "bin"
          New-Item -ItemType Directory -Path $workspaceBin -Force | Out-Null
          if ((Get-Item $workspaceBin -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) {
            throw "Warmup workspace bin must be a real directory."
          }
          $restoreJson = uv run --project .trusted-tools python .trusted-tools/source_artifact_accepted_bin.py restore `
            --repo-root "$workspace" `
            --persisted-root "$env:CI_CACHE_ROOT" --gamever "$env:GAMEVER"
          if ($LASTEXITCODE -ne 0) { throw "Failed to restore the exact accepted binary allowlist." }
          $restore = $restoreJson | ConvertFrom-Json
          if ($restore.binary_lock_sha256 -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Accepted-bin restore omitted the source binary lock identity."
          }
          "BINARY_LOCK_SHA256=$($restore.binary_lock_sha256)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Initialize configured binaries without mutable analysis state
        id: init-binaries
        shell: pwsh
        run: |
          uv run init_gamebin.py prepare "$env:GAMEVER" --binsync skip
          if ($LASTEXITCODE -ne 0) {
            throw "init_gamebin.py prepare failed with exit code $LASTEXITCODE"
          }
      - name: Resolve IDA interpreter identity
        id: resolve-ida
        shell: pwsh
        run: |
          $pythonExe = (Get-Command python -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($pythonExe)) {
            throw "python with idalib is not available on PATH."
          }
          $idaVersion = (& $pythonExe warmup_idb_worker.py --print-ida-version).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($idaVersion)) {
            throw "Failed to resolve the IDA kernel version."
          }
          "python=$pythonExe" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ida-version=$idaVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Verify initialized binaries against source lock
        id: verify-binaries
        shell: pwsh
        run: |
          $verifyJson = uv run --project .trusted-tools python .trusted-tools/source_artifact_accepted_bin.py verify `
            --repo-root "${{ github.workspace }}" --gamever "$env:GAMEVER"
          if ($LASTEXITCODE -ne 0) { throw "Configured binaries do not match the source lock." }
          $verification = $verifyJson | ConvertFrom-Json
          if ($verification.binary_lock_sha256 -ne $env:BINARY_LOCK_SHA256) {
            throw "Binary lock identity drifted during initialization."
          }
      - name: Compute warm IDB transport identity
        id: s3-idb-identity
        shell: pwsh
        run: |
          uv run --project .cache-tools python .cache-tools/ci_s3_cache.py identity `
            --ida-version "${{ steps.resolve-ida.outputs.ida-version }}"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to compute IDB cache identity.' }
      - name: Discover matching warm IDB generation in S3
        id: s3-idb
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-idb-identity.outputs.restore-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.s3-idb-identity.outputs.generation-path }}
          restore-keys: ${{ steps.s3-idb-identity.outputs.restore-prefix }}
      - name: Probe immutable published cache
        id: probe-cache
        shell: pwsh
        run: |
          uv run --project .cache-tools python .cache-tools/idb_cache.py probe `
            --repository "$env:GITHUB_REPOSITORY" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --repo-root "${{ github.workspace }}" `
            --persisted-root "$env:CI_CACHE_ROOT" `
            --gamever "$env:GAMEVER" `
            --ida-version "${{ steps.resolve-ida.outputs.ida-version }}" `
            --github-output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw "IDB cache probe failed." }
      - name: Reject invalid restored IDB generation
        if: steps.s3-idb.outputs.cache-matched-key != '' && steps.probe-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: throw 'Restored S3 IDB generation failed identity or integrity validation.'
      - name: Warm every configured IDA database
        id: warmup-idb
        if: steps.probe-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $maxConcurrency = $env:IDB_WARMUP_MAX_CONCURRENCY
          if ([string]::IsNullOrWhiteSpace($maxConcurrency)) { $maxConcurrency = "2" }
          uv run python warmup_idb.py "$env:GAMEVER" `
            --python "${{ steps.resolve-ida.outputs.python }}" `
            --max-concurrency "$maxConcurrency" `
            --force
          if ($LASTEXITCODE -ne 0) { throw "Required IDB warmup failed." }
      - name: Publish immutable warm cache generation
        id: publish-cache
        if: steps.probe-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          uv run --project .cache-tools python .cache-tools/idb_cache.py publish `
            --repository "$env:GITHUB_REPOSITORY" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --repo-root "${{ github.workspace }}" `
            --persisted-root "$env:CI_CACHE_ROOT" `
            --gamever "$env:GAMEVER" `
            --ida-version "${{ steps.resolve-ida.outputs.ida-version }}" `
            --generation-suffix "${{ github.run_id }}-${{ github.run_attempt }}" `
            --github-output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw "IDB cache publication failed." }
      - name: Resolve immutable cache outputs
        id: resolve-output
        shell: pwsh
        run: |-
          if ("${{ steps.probe-cache.outputs.cache-hit }}" -eq "true") {
            $generation = "${{ steps.probe-cache.outputs.generation }}"
            $cacheKey = "${{ steps.probe-cache.outputs.cache-key }}"
            $leaseId = "${{ steps.probe-cache.outputs.lease-id }}"
            $leaseSha256 = "${{ steps.probe-cache.outputs.lease-sha256 }}"
          } else {
            $generation = "${{ steps.publish-cache.outputs.generation }}"
            $cacheKey = "${{ steps.publish-cache.outputs.cache-key }}"
            $leaseId = "${{ steps.publish-cache.outputs.lease-id }}"
            $leaseSha256 = "${{ steps.publish-cache.outputs.lease-sha256 }}"
          }
          if ([string]::IsNullOrWhiteSpace($generation) -or [string]::IsNullOrWhiteSpace($cacheKey)) {
            throw "Warm IDB cache outputs are incomplete."
          }
          if ($leaseId -notmatch '^[0-9a-f]{32}$' -or $leaseSha256 -notmatch '^[0-9a-f]{64}$') {
            throw "Warm IDB cache lease outputs are incomplete."
          }
          "generation=$generation" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "cache-key=$cacheKey" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "lease-id=$leaseId" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "lease-sha256=$leaseSha256" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Expose verified source binary lock
        id: sync-accepted-bin
        shell: pwsh
        run: |-
          uv run --project .cache-tools python .cache-tools/accepted_bin.py sync `
            --repo-root "${{ github.workspace }}" --persisted-root "$env:CI_CACHE_ROOT" --gamever "$env:GAMEVER"
          if ($LASTEXITCODE -ne 0) { throw 'Accepted binary cache validation failed.' }
          if ($env:BINARY_LOCK_SHA256 -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Verified source binary lock identity is missing."
          }
          "binary-lock-sha256=$env:BINARY_LOCK_SHA256" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Save verified accepted binaries to S3
        if: steps.s3-accepted.outputs.cache-hit != 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-layout.outputs.accepted-key }}
          path: ${{ steps.s3-layout.outputs.accepted-path }}
      - name: Check configured depot files for publication
        id: s3-depot-ready
        shell: pwsh
        run: |
          uv run --project .cache-tools python .cache-tools/ci_s3_cache.py depot-ready
          if ($LASTEXITCODE -ne 0) { throw 'Depot cache validation failed.' }
      - name: Save verified depot binaries to S3
        if: steps.s3-depot.outputs.cache-hit != 'true' && steps.s3-depot-ready.outputs.ready == 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-layout.outputs.depot-key }}
          path: ${{ steps.s3-layout.outputs.depot-path }}
      - name: Resolve published S3 generation and lease paths
        id: s3-selection
        shell: pwsh
        run: |
          uv run --project .cache-tools python .cache-tools/ci_s3_cache.py selection `
            --generation "${{ steps.resolve-output.outputs.generation }}" `
            --lease-id "${{ steps.resolve-output.outputs.lease-id }}"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid published warm IDB selection.' }
      - name: Save immutable warm IDB generation to S3
        if: steps.probe-cache.outputs.cache-hit != 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-selection.outputs.generation-key }}
          path: ${{ steps.s3-selection.outputs.generation-path }}
      - name: Save current-run warm IDB lease to S3
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-selection.outputs.lease-key }}
          path: ${{ steps.s3-selection.outputs.lease-path }}
