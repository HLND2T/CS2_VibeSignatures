name: Source Artifact Bridge Warm IDB Cache
on:
  workflow_call:
    inputs:
      gamever:
        description: Exact GAMEVER from download.yaml
        required: true
        type: string
      source_sha:
        description: Exact source commit containing the analysis config
        required: true
        type: string
      base_sha:
        description: Exact trusted default-branch bridge commit
        required: true
        type: string
    outputs:
      generation:
        description: Immutable published IDB cache generation
        value: ${{ jobs.warmup.outputs.generation }}
      cache_key:
        description: Content-derived IDB cache identity
        value: ${{ jobs.warmup.outputs.cache_key }}
      lease_id:
        description: Persistent protection for this exact generation
        value: ${{ jobs.warmup.outputs.lease_id }}
      lease_sha256:
        description: Digest binding the lease owner and exact selection
        value: ${{ jobs.warmup.outputs.lease_sha256 }}
      binary_lock_sha256:
        description: Canonical source-owned binary lock digest
        value: ${{ jobs.warmup.outputs.binary_lock_sha256 }}
permissions:
  contents: read
jobs:
  warmup:
    if: github.repository == 'HLND2T/CS2_VibeSignatures'
    environment: win64
    runs-on: [self-hosted, cross-platform]
    concurrency:
      group: warmup-idb-${{ github.repository }}-${{ inputs.gamever }}
      cancel-in-progress: false
    outputs:
      generation: ${{ steps.resolve-output.outputs.generation }}
      cache_key: ${{ steps.resolve-output.outputs.cache-key }}
      lease_id: ${{ steps.resolve-output.outputs.lease-id }}
      lease_sha256: ${{ steps.resolve-output.outputs.lease-sha256 }}
      binary_lock_sha256: ${{ steps.sync-accepted-bin.outputs.binary-lock-sha256 }}
    env:
      GAMEVER: ${{ inputs.gamever }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      CI_CACHE_ROOT: ${{ github.workspace }}/.ci-cache/store
      DEPOTDOWNLOADER_STEAM_USERNAME: ${{ secrets.DEPOTDOWNLOADER_STEAM_USERNAME }}
      DEPOTDOWNLOADER_STEAM_PASSWORD: ${{ secrets.DEPOTDOWNLOADER_STEAM_PASSWORD }}
      IDB_WARMUP_MAX_CONCURRENCY: ${{ vars.IDB_WARMUP_MAX_CONCURRENCY }}
      IDB_WARMUP_MAX_MEMORY_MIB: ${{ vars.IDB_WARMUP_MAX_MEMORY_MIB }}
      CI_KIND: bridge-warmup
      PYTHONUTF8: '1'
    steps:
      - name: Validate immutable source input
        id: validate-source
        shell: pwsh
        run: |
          if ($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "source_sha must be a full commit SHA."
          }
          if ($env:BASE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "base_sha must be a full commit SHA."
          }
        if: runner.os == 'Windows'
      - name: Validate immutable source input (Linux)
        id: validate-source-linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - name: Checkout exact cache producer source
        id: checkout-source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Verify immutable source checkout
        id: verify-source
        shell: pwsh
        run: |
          $expectedSourceSha = $env:SOURCE_SHA.ToLowerInvariant()
          $actualSourceSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actualSourceSha -ne $expectedSourceSha) {
            throw "Warmup source checkout drifted: expected=$expectedSourceSha actual=$actualSourceSha"
          }
        if: runner.os == 'Windows'
      - name: Verify immutable source checkout (Linux)
        id: verify-source-linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA,,}" ]]
      - name: Set up uv
        id: setup-uv
        uses: hzqst/setup-uv@ed37cb7af6cd89cb8e2ea2f20674ba1d05dc7b35 # S3 cache backend
        with:
          # enable-cache: auto resolves to false on self-hosted runners, so the uv
          # cache is shared through the existing repository S3 bucket instead.
          enable-cache: true
          cache-s3-bucket: actions-cache-cs2-vibesignatures
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      - name: Checkout cache transport tools from workflow source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .cache-tools
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout trusted binary cache tools
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          path: .trusted-tools
      - name: Sync trusted binary cache environment
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: sync-trusted
      - name: Prepare clean job-local cache layout
        id: s3-layout
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-prepare
      - name: Restore accepted binaries from S3
        id: s3-accepted
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-layout.outputs.accepted-key }}
          path: ${{ steps.s3-layout.outputs.accepted-path }}
          restore-keys: ${{ steps.s3-layout.outputs.accepted-restore-keys }}
      - name: Restore depot binaries from S3
        id: s3-depot
        if: steps.s3-accepted.outputs.cache-restored != 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-layout.outputs.depot-key }}
          path: ${{ steps.s3-layout.outputs.depot-path }}
          restore-keys: ${{ steps.s3-layout.outputs.depot-restore-keys }}
      - name: Verify restored binary caches against source lock
        env:
          CACHE_ACCEPTED_HIT: ${{ steps.s3-accepted.outputs.cache-restored }}
          CACHE_DEPOT_HIT: ${{ steps.s3-depot.outputs.cache-restored }}
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-verify-restored
      - name: Restore local accepted binaries
        id: prepare-workspace
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: accepted-restore
      - name: Initialize configured binaries without mutable analysis state
        id: init-binaries
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: init-binaries
      - name: Resolve IDA interpreter identity
        id: resolve-ida
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: resolve-ida
      - name: Verify initialized binaries against source lock
        id: verify-binaries
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: accepted-verify
      - name: Compute warm IDB transport identity
        id: s3-idb-identity
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-identity
      - name: Discover matching warm IDB generation in S3
        id: s3-idb
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-idb-identity.outputs.restore-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.s3-idb-identity.outputs.generation-path }}
          restore-keys: ${{ steps.s3-idb-identity.outputs.restore-prefixes }}
      - name: Probe immutable published cache
        id: probe-cache
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: idb-probe
      - name: Reject invalid restored IDB generation
        if: steps.s3-idb.outputs.cache-matched-key != '' && steps.probe-cache.outputs.cache-hit != 'true'
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: reject-restored
      - name: Warm every configured IDA database
        id: warmup-idb
        if: steps.probe-cache.outputs.cache-hit != 'true'
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: warmup
      - name: Publish immutable warm cache generation
        id: publish-cache
        if: steps.probe-cache.outputs.cache-hit != 'true'
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: idb-publish
      - name: Resolve immutable cache outputs
        id: resolve-output
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: resolve-selection
      - name: Expose verified source binary lock
        id: sync-accepted-bin
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: accepted-stage
      - name: Save verified accepted binaries to S3
        if: steps.s3-accepted.outputs.cache-hit != 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-layout.outputs.accepted-key }}
          path: ${{ steps.s3-layout.outputs.accepted-path }}
      - name: Check configured depot files for publication
        id: s3-depot-ready
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-depot-ready
      - name: Save verified depot binaries to S3
        if: steps.s3-depot.outputs.cache-hit != 'true' && steps.s3-depot-ready.outputs.ready == 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-layout.outputs.depot-key }}
          path: ${{ steps.s3-layout.outputs.depot-path }}
      - name: Resolve published S3 generation and lease paths
        id: s3-selection
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-selection
      - name: Save immutable warm IDB generation to S3
        if: steps.probe-cache.outputs.cache-hit != 'true' || !startsWith(steps.s3-idb.outputs.cache-matched-key,
          steps.s3-layout.outputs.prefix)
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-selection.outputs.generation-key }}
          path: ${{ steps.s3-selection.outputs.generation-path }}
      - name: Save current-run warm IDB lease to S3
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-selection.outputs.lease-key }}
          path: ${{ steps.s3-selection.outputs.lease-path }}
