name: Verify Release Bundle
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      gamever:
        required: true
        type: string
      release_version:
        required: true
        type: string
      build_id:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      artifact_digest:
        required: true
        type: string
    outputs:
      manifest_digest:
        value: ${{ jobs.verify.outputs.manifest_digest }}
      bundle_digest:
        value: ${{ jobs.verify.outputs.bundle_digest }}
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      manifest_digest: ${{ steps.verify-bundle.outputs.manifest_digest }}
      bundle_digest: ${{ steps.verify-bundle.outputs.bundle_digest }}
      cpp_artifact_id: ${{ steps.upload-cpp-inputs.outputs.artifact-id }}
      cpp_artifact_digest: ${{ steps.upload-cpp-inputs.outputs.artifact-digest }}
    steps:
      - name: Checkout exact immutable source and SDK
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Verify source remains reachable from the default branch
        shell: pwsh
        run: |
          $sourceSha = "${{ inputs.source_sha }}".ToLowerInvariant()
          if ($sourceSha -notmatch '^[0-9a-f]{40}$' -or (git rev-parse HEAD).Trim().ToLowerInvariant() -ne $sourceSha) {
            throw "Hosted Release verifier checkout does not match the immutable source SHA."
          }
          git fetch --no-tags origin "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the default branch." }
          git merge-base --is-ancestor $sourceSha "origin/${{ github.event.repository.default_branch }}"
          if ($LASTEXITCODE -ne 0) { throw "Release source is no longer reachable from the default branch." }
      - name: Bind exact Release Actions Artifact
        id: bind-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $name = "${{ inputs.artifact_name }}"
          $expectedDigest = "${{ inputs.artifact_digest }}".ToLowerInvariant()
          if ($expectedDigest -match '^[0-9a-f]{64}$') { $expectedDigest = "sha256:$expectedDigest" }
          if ($expectedDigest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Invalid Release Artifact digest." }
          $response = gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $response.total_count -gt 100) { throw "Unable to bind current-run Artifacts." }
          $matches = @($response.artifacts | Where-Object { $_.name -ceq $name })
          if ($matches.Count -ne 1) { throw "Expected exactly one Release Artifact named '$name'." }
          $artifact = $matches[0]
          if ($artifact.expired -or $artifact.workflow_run.id -ne ${{ github.run_id }}) {
            throw "Release Artifact is expired or belongs to another run."
          }
          if (-not ($artifact.digest -is [string]) -or $artifact.digest.ToLowerInvariant() -ne $expectedDigest) {
            throw "Release Artifact digest mismatch."
          }
          "artifact_id=$($artifact.id)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Download exact Release bundle
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ steps.bind-artifact.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-bundle
      - name: Verify exact source-owned C++ SDK identity
        shell: pwsh
        run: |
          $manifestPath = Get-ChildItem -LiteralPath "${{ runner.temp }}/release-bundle" -Filter "release-manifest-*.json"
          if (@($manifestPath).Count -ne 1) { throw "Release bundle must contain exactly one manifest." }
          $manifest = Get-Content -LiteralPath $manifestPath.FullName -Raw | ConvertFrom-Json
          $sdkRef = [string]$manifest.cpp_sdk.ref
          $sdkSha = ([string]$manifest.cpp_sdk.sha).ToLowerInvariant()
          if ($sdkSha -notmatch '^[0-9a-f]{40}$') { throw "Release manifest C++ SDK SHA is invalid." }
          # Historical source checkouts do not contain the new SDK helper module.
          $sdkLinks = @(git ls-tree "${{ inputs.source_sha }}" -- s2sdk hl2sdk_cs2)
          if ($LASTEXITCODE -ne 0 -or $sdkLinks.Count -ne 1 -or
              $sdkLinks[0] -cnotmatch '^160000 commit ([0-9a-f]{40})\t(s2sdk|hl2sdk_cs2)$') {
            throw "Source must bind exactly one SDK gitlink."
          }
          $sourceGitlink = $Matches[1]
          $sdkPath = Join-Path "${{ github.workspace }}" $Matches[2]
          $checkedOutSha = (git -C $sdkPath rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $sdkRef -cne 'source-gitlink' -or `
              $sourceGitlink -notmatch '^[0-9a-f]{40}$' -or $sdkSha -ne $sourceGitlink -or `
              $checkedOutSha -ne $sourceGitlink) {
            throw "Release C++ SDK does not match the immutable source gitlink."
          }
      - name: Checkout trusted verification tools
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          persist-credentials: false
      - name: Verify Release bundle, archives, and source identities
        id: verify-bundle
        shell: pwsh
        run: |
          $json = & uv run --project .ci-tools python .ci-tools/release_bundle.py verify `
            --repo-root "${{ github.workspace }}" `
            --bundle-root "${{ runner.temp }}/release-bundle" `
            --source-sha "${{ inputs.source_sha }}" `
            --gamever "${{ inputs.gamever }}" `
            --release-version "${{ inputs.release_version }}" `
            --build-id "${{ inputs.build_id }}" `
            --actions-artifact-name "${{ inputs.artifact_name }}"
          if ($LASTEXITCODE -ne 0) { throw "Hosted Release bundle verification failed." }
          $document = ($json -join "`n") | ConvertFrom-Json
          foreach ($field in @('manifest_sha256', 'bundle_inventory_sha256')) {
            if ($document.$field -notmatch '^(sha256:)?[0-9a-f]{64}$') { throw "Hosted verifier output $field is invalid." }
          }
          "manifest_digest=$($document.manifest_sha256)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "bundle_digest=$($document.bundle_inventory_sha256)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Export exact verified snapshot for both hosted ABIs
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GAMEVER: ${{ inputs.gamever }}
        run: |
          set -euo pipefail
          uv run --project .ci-tools python .ci-tools/ci_cpp_validation.py export \
            --repo-root "$GITHUB_WORKSPACE" --source-sha "$SOURCE_SHA" --gamever "$GAMEVER" \
            --snapshot "$RUNNER_TEMP/release-bundle/gamesymbols/$GAMEVER.yaml" \
            --config "configs/$GAMEVER.yaml" --output "$RUNNER_TEMP/release-cpp-inputs"
      - uses: actions/upload-artifact@v4
        id: upload-cpp-inputs
        with:
          name: cpp-input-release-verify-${{ inputs.gamever }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-cpp-inputs
          if-no-files-found: error
          retention-days: 14
  cpp-validation:
    # Independently revalidate the finalized snapshot with both hosted ABIs.
    needs: verify
    uses: ./.github/workflows/cpp-validation.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      gamever: ${{ inputs.gamever }}
      artifact_id: ${{ needs.verify.outputs.cpp_artifact_id }}
      artifact_digest: ${{ needs.verify.outputs.cpp_artifact_digest }}
      scope: release-verify
