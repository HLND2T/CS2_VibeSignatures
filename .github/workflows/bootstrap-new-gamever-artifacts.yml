name: Bootstrap New GAMEVER Artifacts
on:
  workflow_call:
    inputs:
      pull_request_number:
        required: true
        type: number
      gamever:
        required: true
        type: string
      prior_gamever:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      merge_sha:
        required: true
        type: string
      plan_artifact_name:
        required: true
        type: string
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: source-artifact-bootstrap-${{ github.repository }}-${{ inputs.pull_request_number }}-${{ inputs.gamever }}
  cancel-in-progress: false
env:
  CS2VIBE_STRING_MIN_LENGTH: '4'
jobs:
  warmup-idb:
    uses: ./.github/workflows/warmup-idb.yml
    with:
      gamever: ${{ inputs.gamever }}
      source_sha: ${{ inputs.merge_sha }}
    secrets: inherit
  build-bootstrap-candidate:
    needs: warmup-idb
    environment: win64
    runs-on: [self-hosted, cross-platform]
    outputs:
      prepared_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      prepared_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      GAMEVER: ${{ inputs.gamever }}
      PRIOR_GAMEVER: ${{ inputs.prior_gamever }}
      MERGE_SHA: ${{ inputs.merge_sha }}
      PR_NUMBER: ${{ inputs.pull_request_number }}
      IDB_CACHE_GENERATION: ${{ needs.warmup-idb.outputs.generation }}
      IDB_CACHE_KEY: ${{ needs.warmup-idb.outputs.cache_key }}
      IDB_CACHE_LEASE_ID: ${{ needs.warmup-idb.outputs.lease_id }}
      IDB_CACHE_LEASE_SHA256: ${{ needs.warmup-idb.outputs.lease_sha256 }}
      BINARY_LOCK_SHA256: ${{ needs.warmup-idb.outputs.binary_lock_sha256 }}
      CI_CACHE_ROOT: ${{ github.workspace }}/.ci-cache/store
      CS2VIBE_AGENT: ${{ secrets.CS2VIBE_AGENT }}
      CS2VIBE_AGENT_MODEL: ${{ secrets.CS2VIBE_AGENT_MODEL }}
      CS2VIBE_LLM_APIKEY: ${{ secrets.CS2VIBE_LLM_APIKEY }}
      CS2VIBE_LLM_BASEURL: ${{ secrets.CS2VIBE_LLM_BASEURL }}
      CS2VIBE_LLM_EFFORT: ${{ secrets.CS2VIBE_LLM_EFFORT }}
      CS2VIBE_LLM_FAKE_AS: ${{ secrets.CS2VIBE_LLM_FAKE_AS }}
      CS2VIBE_LLM_MODEL: ${{ secrets.CS2VIBE_LLM_MODEL }}
      CI_KIND: bootstrap
      PYTHONUTF8: '1'
      SOURCE_SHA: ${{ inputs.merge_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - name: Checkout exact prospective merge source without publisher credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.merge_sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Verify immutable bootstrap source and no publication PAT
        shell: pwsh
        run: |
          if ($env:MERGE_SHA -notmatch '^[0-9a-f]{40}$' -or (git rev-parse HEAD).Trim() -ne $env:MERGE_SHA) {
            throw "Bootstrap checkout does not match merge_sha."
          }
          if ($env:PRIOR_GAMEVER -ne "none" -and $env:PRIOR_GAMEVER -notmatch '^[0-9]{4,10}[a-z]?$') {
            throw "Bootstrap prior_gamever input is invalid."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SOURCE_ARTIFACT_BOOTSTRAP_PAT)) {
            throw "Artifact publication PAT must never enter the self-hosted bootstrap job."
          }
          git diff --exit-code "${{ inputs.base_sha }}" "$env:MERGE_SHA" -- .gitmodules
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap PR must not change trusted submodule routing." }
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 8
          if ($LASTEXITCODE -ne 0) { throw "Trusted SDK submodule initialization failed." }
        if: runner.os == 'Windows'
      - name: Verify immutable bootstrap source and no publication PAT (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$MERGE_SHA" ]]
          [[ "$PRIOR_GAMEVER" == none || "$PRIOR_GAMEVER" =~ ^[0-9]{4,10}[a-z]?$ ]]
          [[ -z "${SOURCE_ARTIFACT_BOOTSTRAP_PAT:-}" ]]
          git diff --exit-code "$BASE_SHA" "$MERGE_SHA" -- .gitmodules
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 8
      - name: Set up uv
        uses: hzqst/setup-uv@ed37cb7af6cd89cb8e2ea2f20674ba1d05dc7b35 # S3 cache backend
        with:
          # enable-cache: auto resolves to false on self-hosted runners, so the uv
          # cache is shared through the existing repository S3 bucket instead.
          enable-cache: true
          cache-s3-bucket: actions-cache-cs2-vibesignatures
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      - name: Checkout cache transport tools from workflow source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .cache-tools
          fetch-depth: 1
          persist-credentials: false
      - name: Download bound trusted plan
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ runner.temp }}/source-artifact-plan
      - name: Prepare clean job-local cache layout
        id: s3-layout
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-prepare
      - name: Restore accepted binaries from S3
        id: s3-accepted
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-layout.outputs.accepted-key }}
          path: ${{ steps.s3-layout.outputs.accepted-path }}
          restore-keys: ${{ steps.s3-layout.outputs.accepted-restore-keys }}
      - name: Restore depot binaries from S3
        id: s3-depot
        if: steps.s3-accepted.outputs.cache-restored != 'true'
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-layout.outputs.depot-key }}
          path: ${{ steps.s3-layout.outputs.depot-path }}
          restore-keys: ${{ steps.s3-layout.outputs.depot-restore-keys }}
      - name: Verify restored binary caches against source lock
        env:
          CACHE_ACCEPTED_HIT: ${{ steps.s3-accepted.outputs.cache-restored }}
          CACHE_DEPOT_HIT: ${{ steps.s3-depot.outputs.cache-restored }}
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-verify-restored
      - name: Restore binary-only accepted state
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: accepted-restore
      - name: Resolve exact S3 generation and lease paths
        id: s3-selection
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: cache-selection
      - name: Restore exact warm IDB payload from S3
        id: s3-generation
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-selection.outputs.generation-key }}
          path: ${{ steps.s3-selection.outputs.generation-path }}
          required: 'true'
      - name: Restore current-run IDB lease from S3
        id: s3-lease
        uses: ./.cache-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-selection.outputs.lease-key }}
          path: ${{ steps.s3-selection.outputs.lease-path }}
          required: 'true'
      - name: Restore exact warm IDB generation
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: idb-restore
      - name: Full empty-root bootstrap with rename and local-init BinSync prepare
        id: binsync-local
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: bootstrap-analyze
      - name: Build snapshot and gamedata gates for hosted ABI validation
        id: gates
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: bootstrap-gates
      - name: Package prepared bootstrap materials
        id: package
        env:
          CI_REFS_BEFORE: ${{ steps.binsync-local.outputs.remote_refs_before }}
          CI_REFS_AFTER: ${{ steps.binsync-local.outputs.remote_refs_after }}
          CI_SNAPSHOT_DIGEST: ${{ steps.gates.outputs.snapshot }}
          CI_GAMEDATA_DIGEST: ${{ steps.gates.outputs.gamedata }}
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: bootstrap-package
      - name: Upload prepared bootstrap materials
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.candidate-artifact-name }}
          path: ${{ env.CANDIDATE_PACKAGE }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Upload failed bootstrap diagnostics
        if: >-
          failure() && (steps.binsync-local.outcome == 'failure' || steps.gates.outcome == 'failure' ||
          steps.package.outcome == 'failure' || steps.upload.outcome == 'failure')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-diagnostics-${{ inputs.pull_request_number }}-${{ inputs.gamever }}-${{ github.run_id }}-${{
            github.run_attempt }}
          # Upload partial outputs directly; canonical candidate packaging requires all gates to pass.
          path: |
            ${{ runner.temp }}/new-gamever-bin-artifacts/${{ github.run_id }}-${{ github.run_attempt }}/**/*.yaml
            ${{ runner.temp }}/new-gamever-force-all-execution-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/new-gamever-gates/${{ github.run_id }}-${{ github.run_attempt }}/**
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn
  publish-new-gamever-artifacts:
    needs: finalize-bootstrap
    environment: artifact-bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prospective merge tree as non-executable data
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.merge_sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
          path: prospective
      - name: Checkout trusted base publisher tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          path: trusted-publisher
      - name: Checkout exact bound PR head for artifact-only commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
          path: publication
      - name: Set up trusted publisher environment
        uses: astral-sh/setup-uv@v9.0.0
      - name: Sync trusted publisher dependencies
        run: |-
          uv sync --project trusted-publisher --locked
      - name: Download bound plan and exact bootstrap candidate
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: evidence/plan
      - name: Download exact bootstrap candidate package
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.finalize-bootstrap.outputs.candidate-artifact-name }}
          path: evidence/candidate
      - name: Revalidate PR, remote head, candidate, and allowed branch
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.finalize-bootstrap.outputs.candidate-artifact-digest }}
        run: |
          $pull = gh api "repos/${{ github.repository }}/pulls/${{ inputs.pull_request_number }}" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pull.state -ne "open") { throw "Bootstrap PR is no longer open." }
          # PR metadata can retain an older base SHA; publication needs the live default-branch ref.
          $baseSha = gh api "repos/${{ github.repository }}/git/ref/heads/${{ github.event.repository.default_branch }}" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve the current default-branch SHA." }
          $remoteHead = [string]$pull.head.sha
          $artifactDigest = $env:CANDIDATE_ARTIFACT_DIGEST.ToLowerInvariant()
          if ($artifactDigest -match '^[0-9a-f]{64}$') { $artifactDigest = "sha256:$artifactDigest" }
          $verification = Join-Path "${{ github.workspace }}" "evidence\publication-verification.json"
          Set-Location -LiteralPath "${{ github.workspace }}/trusted-publisher"
          uv run --project . python new_gamever_artifact.py verify `
            --repo-root "${{ github.workspace }}/prospective" `
            --plan "${{ github.workspace }}/evidence/plan/trusted-source-artifact-plan.json" `
            --artifact-root "${{ github.workspace }}/evidence/candidate/bin_artifacts" `
            --manifest "${{ github.workspace }}/evidence/candidate/candidate-manifest.json" `
            --repository "${{ github.repository }}" `
            --default-branch "${{ github.event.repository.default_branch }}" `
            --base-repository "$($pull.base.repo.full_name)" --base-ref "$($pull.base.ref)" `
            --base-sha "$baseSha" `
            --head-repository "$($pull.head.repo.full_name)" --head-ref "$($pull.head.ref)" `
            --head-sha "${{ inputs.head_sha }}" --current-remote-head "$remoteHead" `
            --pr-number "${{ inputs.pull_request_number }}" `
            --actions-artifact-name "${{ needs.finalize-bootstrap.outputs.candidate-artifact-name }}" `
            --actions-artifact-digest "$artifactDigest" `
            --workflow-run-id "${{ github.run_id }}" --workflow-run-attempt "${{ github.run_attempt }}" `
            --execution-report "${{ github.workspace }}/evidence/candidate/force-all-execution.json" `
            --output "$verification"
          if ($LASTEXITCODE -ne 0) { throw "Hosted bootstrap candidate verification failed." }
          "verification=$verification" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Create direct-child artifact-only commit
        id: commit
        shell: pwsh
        run: |
          git -C publication config user.name "source-artifact-automation"
          git -C publication config user.email "source-artifact-automation@users.noreply.github.com"
          $receipt = Join-Path "${{ github.workspace }}" "evidence\publication-commit.json"
          Set-Location -LiteralPath "${{ github.workspace }}/trusted-publisher"
          uv run --project . python new_gamever_artifact.py commit `
            --repo-root "${{ github.workspace }}/publication" `
            --artifact-root "${{ github.workspace }}/evidence/candidate/bin_artifacts" `
            --verification "${{ steps.verify.outputs.verification }}" `
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            --output "$receipt"
          if ($LASTEXITCODE -ne 0) { throw "Artifact-only bootstrap commit preparation failed." }
          $commit = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          "commit-sha=$($commit.commit_sha)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Fast-forward push only the bound bump branch with protected PAT
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_USERNAME: source-artifact-automation
          GIT_PASSWORD: ${{ secrets.SOURCE_ARTIFACT_BOOTSTRAP_PAT }}
        run: |-
          if ([string]::IsNullOrWhiteSpace($env:GIT_PASSWORD)) { throw "SOURCE_ARTIFACT_BOOTSTRAP_PAT is unavailable." }
          $pull = gh api "repos/${{ github.repository }}/pulls/${{ inputs.pull_request_number }}" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pull.head.sha -ne "${{ inputs.head_sha }}" -or `
              $pull.base.repo.full_name -ne "${{ github.repository }}" -or `
              $pull.base.ref -ne "${{ github.event.repository.default_branch }}") {
            throw "PR base or head drifted immediately before protected push."
          }
          $baseSha = gh api "repos/${{ github.repository }}/git/ref/heads/${{ github.event.repository.default_branch }}" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $baseSha -ne "${{ inputs.base_sha }}") {
            throw "PR base or head drifted immediately before protected push."
          }
          $askpass = Join-Path $env:RUNNER_TEMP "source-artifact-askpass.sh"
          @'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$GIT_USERNAME" ;;
            *Password*) printf '%s\n' "$GIT_PASSWORD" ;;
            *) exit 1 ;;
          esac
          '@ | Set-Content -LiteralPath $askpass -Encoding utf8NoBOM
          chmod 700 $askpass
          try {
            $env:GIT_ASKPASS = $askpass
            $env:GIT_TERMINAL_PROMPT = "0"
            git -C publication -c credential.helper= push origin `
              "HEAD:refs/heads/bump-download/${{ inputs.gamever }}"
            if ($LASTEXITCODE -ne 0) { throw "Protected artifact fast-forward push failed." }
          } finally {
            Remove-Item -LiteralPath $askpass -Force -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_ASKPASS -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_PASSWORD -ErrorAction SilentlyContinue
          }
      - name: Verify published bootstrap PR head
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_HEAD_REF: bump-download/${{ inputs.gamever }}
          EXPECTED_HEAD_SHA: ${{ steps.commit.outputs.commit-sha }}
        run: |-
          $pollIntervalMs = 2000
          $deadline = (Get-Date).AddMilliseconds(60000)
          # A successful push can precede the PR API's head update, so wait for the
          # published head to converge instead of reading it once.
          while ($true) {
            $pull = gh api "repos/$env:REPOSITORY/pulls/$env:PR_NUMBER" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Published artifact pull request could not be read back." }
            if ($pull.state -ne "open" -or `
                $pull.head.ref -ne $env:EXPECTED_HEAD_REF -or `
                $pull.head.repo.full_name -ne $env:REPOSITORY) {
              throw "Published artifact pull request identity or state changed."
            }
            if ($pull.head.sha -eq $env:EXPECTED_HEAD_SHA) { break }
            $remainingMs = [int](($deadline - (Get-Date)).TotalMilliseconds)
            if ($remainingMs -le 0) {
              throw "Timed out waiting for PR #$env:PR_NUMBER head: expected $env:EXPECTED_HEAD_SHA, observed $($pull.head.sha)."
            }
            Start-Sleep -Milliseconds ([Math]::Min($pollIntervalMs, $remainingMs))
          }
  cpp-validation:
    needs: build-bootstrap-candidate
    uses: ./.github/workflows/cpp-validation.yml
    with:
      source_sha: ${{ inputs.merge_sha }}
      gamever: ${{ inputs.gamever }}
      artifact_id: ${{ needs.build-bootstrap-candidate.outputs.prepared_artifact_id }}
      artifact_digest: ${{ needs.build-bootstrap-candidate.outputs.prepared_artifact_digest }}
      scope: bootstrap
      input_path: cpp-inputs
  finalize-bootstrap:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ inputs.merge_sha }}
      GAMEVER: ${{ inputs.gamever }}
      PR_NUMBER: ${{ inputs.pull_request_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.merge_sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .cache-tools
          persist-credentials: false
      - name: Bind exact current-run prepared-bootstrap
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          CI_ARTIFACT_ID: ${{ needs.build-bootstrap-candidate.outputs.prepared_artifact_id }}
          CI_ARTIFACT_DIGEST: ${{ needs.build-bootstrap-candidate.outputs.prepared_artifact_digest }}
        run: uv run --project .cache-tools python .cache-tools/ci_runner.py bind-artifact
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build-bootstrap-candidate.outputs.prepared_artifact_id }}
          path: ${{ runner.temp }}/prepared-bootstrap
      - name: Bind exact current-run cpp-evidence
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          CI_ARTIFACT_ID: ${{ needs.cpp-validation.outputs.artifact_id }}
          CI_ARTIFACT_DIGEST: ${{ needs.cpp-validation.outputs.artifact_digest }}
        run: uv run --project .cache-tools python .cache-tools/ci_runner.py bind-artifact
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.cpp-validation.outputs.artifact_id }}
          path: ${{ runner.temp }}/cpp-evidence
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ runner.temp }}/source-artifact-plan
      - name: Package canonical candidate with hosted ABI evidence
        id: package
        uses: ./.cache-tools/.github/actions/ci-command
        with:
          command: bootstrap-finalize
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ steps.package.outputs.candidate-artifact-name }}
          path: ${{ env.CANDIDATE_PACKAGE }}
          if-no-files-found: error
          retention-days: 7
    needs:
      - build-bootstrap-candidate
      - cpp-validation
    outputs:
      candidate-artifact-name: ${{ steps.package.outputs.candidate-artifact-name }}
      candidate-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
