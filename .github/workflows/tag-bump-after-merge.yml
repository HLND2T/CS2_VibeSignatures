name: Dispatch Build After Bump Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve-release:
    if: >
      (github.repository == 'HLND2T/CS2_VibeSignatures') &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.head.ref, 'bump-download/')
    runs-on: ubuntu-latest
    outputs:
      gamever: ${{ steps.resolve.outputs.gamever }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Resolve immutable release identity from merged bump PR
        id: resolve
        shell: pwsh
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          $headRef = $env:PR_HEAD_REF
          $gamever = $headRef.Substring("bump-download/".Length)
          $sourceSha = $env:SOURCE_SHA
          if ($gamever -notmatch '^[0-9]{4,10}[a-z]?$') { throw "Unexpected GAMEVER in branch: $headRef" }
          if ($sourceSha -notmatch '^[0-9a-fA-F]{40}$') { throw "Missing full bump merge SHA." }
          "gamever=$gamever" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_sha=$($sourceSha.ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
  release:
    needs: resolve-release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # A reusable workflow retains this PR run's ref. Start a default-branch
      # run so the release environment can apply its protected-branch policy.
      - name: Dispatch immutable release from the default branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GAMEVER: ${{ needs.resolve-release.outputs.gamever }}
          SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
          SOURCE_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          $payload = @{
            ref = $env:DEFAULT_BRANCH
            inputs = @{
              gamever = $env:GAMEVER
              source_sha = $env:SOURCE_SHA
              source_pull_request = $env:SOURCE_PULL_REQUEST
              publication_mode = 'publish'
              source_artifact_mode = 'rebuild'
            }
          } | ConvertTo-Json -Depth 3 -Compress
          $payload | gh api --method POST "repos/$env:GH_REPO/actions/workflows/build-on-self-runner.yml/dispatches" --input -
          if ($LASTEXITCODE -ne 0) { throw "Failed to dispatch the immutable release build." }
          Write-Output "Dispatched GAMEVER $env:GAMEVER from $env:SOURCE_SHA on $env:DEFAULT_BRANCH."
